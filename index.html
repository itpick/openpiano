<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OpenPiano — learn piano, open source</title>
<meta name="description" content="OpenPiano: an open, offline-first piano-learning app prototype. Courses, songs, lessons, falling-notes engine, Web Audio synth, mic grading (roadmap).">
<meta name="theme-color" content="#12141a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='24' font-size='24'%3E%F0%9F%8E%B9%3C/text%3E%3C/svg%3E">
<style>
  /* OpenPiano design system — Simply Piano inspired:
     bright, warm, playful. Purple #8217FF, teal #00C8AB, cream #F4F1DE. */
  :root {
    --brand:#8217ff; --brand2:#4f21b3; --teal:#00c8ab; --teal2:#00a892;
    --cream:#f4f1de; --paper:#fffdf7; --sun:#ffd166; --coral:#ff7a7a;
    --soloist:#3d8bff; --chords:#ff5fa8;
    --bg:#faf7f0; --ink:#2b2344; --muted:#7a7292;
    --card:#ffffff; --line:#eee7f8;
    --radius:18px; --shadow:0 4px 20px rgba(90,60,180,.10);
    --shadow-lg:0 10px 34px rgba(90,60,180,.16);
    --max:1060px;
  }
  * { box-sizing:border-box; margin:0; }
  html { -webkit-text-size-adjust:100%; }
  body { background:var(--bg); color:var(--ink);
    font:16px/1.55 "Nunito","Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif; }
  a { color:var(--brand); text-decoration:none; }
  button { font:inherit; }
  h1,h2,h3 { font-weight:800; letter-spacing:-.01em; }

  /* ---------- header ---------- */
  header.app {
    position:sticky; top:0; z-index:10;
    background:linear-gradient(90deg,var(--brand),#9d4dff);
    box-shadow:0 2px 14px rgba(130,23,255,.28);
    padding:10px 16px; display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  }
  header.app .logo { font-weight:900; font-size:1.15rem; color:#fff; letter-spacing:.01em; }
  header.app .logo span { background:rgba(255,255,255,.22); border-radius:8px; padding:1px 8px; margin-left:6px; font-size:.62rem; font-weight:800; letter-spacing:.08em; vertical-align:middle; }
  header.app nav { display:flex; gap:4px; flex-wrap:wrap; }
  header.app nav button {
    background:none; border:none; color:#e8dcff;
    border-radius:999px; padding:7px 14px; cursor:pointer; font-weight:700;
  }
  header.app nav button:hover { background:rgba(255,255,255,.14); color:#fff; }
  header.app nav button.active { background:#fff; color:var(--brand); box-shadow:0 2px 8px rgba(0,0,0,.18); }
  header.app select {
    background:rgba(255,255,255,.16); color:#fff; border:1px solid rgba(255,255,255,.35);
    border-radius:8px; padding:4px 8px; font-size:.8rem;
  }
  header.app select option { color:var(--ink); }

  main { max-width:var(--max); margin:0 auto; padding:22px 16px 90px; }
  h1 { font-size:1.7rem; margin:10px 0 2px; }
  .sub { color:var(--muted); margin-bottom:18px; font-size:.97rem; }

  /* ---------- cards & grids ---------- */
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:14px; }
  .card {
    background:var(--card); border-radius:var(--radius); padding:16px;
    box-shadow:var(--shadow); cursor:pointer; transition:transform .15s, box-shadow .15s;
    border:2px solid transparent;
  }
  .card:hover { transform:translateY(-3px); box-shadow:var(--shadow-lg); border-color:var(--brand); }
  .card h3 { font-size:1rem; margin-bottom:3px; }
  .card .meta { color:var(--muted); font-size:.82rem; }
  .card.locked { opacity:.55; cursor:default; filter:saturate(.6); }
  .card.locked:hover { transform:none; box-shadow:var(--shadow); border-color:transparent; }
  .card .stars { color:#f5a623; letter-spacing:2px; font-size:.88rem; min-height:1em; display:block; }
  .tier { font-size:.68rem; border-radius:999px; padding:3px 10px; display:inline-block; margin-bottom:7px; font-weight:800; color:#fff; }
  .tier.beginner{background:linear-gradient(90deg,#39c26d,#2ba55c)}
  .tier.intermediate{background:linear-gradient(90deg,#ff9f43,#ff7a1a)}
  .tier.chords-basics{background:linear-gradient(90deg,#ff5fa8,#e94b8f)}
  .tier.chords-prog{background:linear-gradient(90deg,#c86bff,#a03bff)}
  .tier.lead-sheet{background:linear-gradient(90deg,#8217ff,#5c0fd6)}
  .pathbadge { font-size:.68rem; border-radius:999px; padding:3px 10px; display:inline-block; margin-left:6px; font-weight:800; }
  .pathbadge.soloist{background:#e3edff;color:var(--soloist)} .pathbadge.chords{background:#ffe1ef;color:var(--chords)}

  /* ---------- lesson ---------- */
  .back { background:#fff; border:2px solid var(--line); color:var(--brand);
          border-radius:999px; padding:7px 16px; cursor:pointer; margin-bottom:12px; font-weight:700; }
  .back:hover { border-color:var(--brand); }
  .lessonhead { display:flex; gap:12px; align-items:baseline; flex-wrap:wrap; margin-bottom:12px; }
  .lessonhead h1 { margin:0; }
  .lessonmeta { color:var(--muted); font-size:.86rem; }
  .recapbox { background:linear-gradient(90deg,#f3ecff,#fffdf7); border:2px dashed #d9c9ff;
    border-radius:var(--radius); padding:10px 16px; margin-bottom:14px; font-size:.9rem; color:var(--ink); }
  .recapbox b { color:var(--brand); }
  #l-recap .back { font-size:.78rem; padding:3px 12px; margin:0 0 0 8px; }

  /* ---------- falling lane ---------- */
  .lane {
    position:relative; height:clamp(200px, 34vh, 300px); overflow:hidden; margin-bottom:10px;
    background:linear-gradient(180deg,#f3edff 0%,#fdf6ff 70%,#efe3ff 100%);
    border-radius:var(--radius); border:3px solid #e6d9ff;
  }
  .lane .hitline { position:absolute; left:0; right:0; bottom:0; height:4px;
    background:linear-gradient(90deg,var(--teal),var(--brand)); border-radius:99px; }
  .block { position:absolute; border-radius:10px; display:flex; align-items:flex-end; justify-content:center;
    font-size:.75rem; color:#fff; font-weight:800; padding-bottom:3px;
    box-shadow:0 3px 10px rgba(130,23,255,.25); }
  .block.pending { background:linear-gradient(180deg,#9d6bff,#8217ff); }
  .block.chord { background:linear-gradient(180deg,#ffd166,#ff9f43); color:#7a4a00; }
  .block.done-good { background:linear-gradient(180deg,#57dd8f,#2ba55c); }
  .block.done-ok { background:linear-gradient(180deg,#ffd166,#ff9f43); color:#7a4a00; }
  .block.missed { background:#c9c2d8; color:#fff; box-shadow:none; }
  .block.bad-flash { background:var(--coral) !important; }

  /* ---------- piano ---------- */
  .kb { position:relative; height:170px; user-select:none; touch-action:none;
        display:flex; background:#3b2d63; border-radius:14px; overflow:hidden;
        box-shadow:0 6px 22px rgba(90,60,180,.28); }
  .wk { flex:1; background:linear-gradient(#fff,#f0ecf6); margin:0 1px 1px 0;
        border-radius:0 0 7px 7px; position:relative; cursor:pointer; }
  .wk .lbl,.bk .lbl { position:absolute; bottom:8px; left:0; right:0; text-align:center;
        color:#a99cc4; font-size:.68rem; font-weight:700; pointer-events:none; }
  .bk .lbl { bottom:6px; color:#c9bfe0; font-size:.58rem; }
  .bk { position:absolute; top:0; height:62%; z-index:2;
        background:linear-gradient(#4a3a78,#241b42); border-radius:0 0 6px 6px; cursor:pointer; }
  .wk.down { background:linear-gradient(#d9fbf2,#a8ecdF); }
  .bk.down { background:linear-gradient(#00c8ab,#00917c); }
  .wk.hl,.bk.hl { box-shadow:inset 0 0 0 3px var(--brand); }
  .wk.hl { background:linear-gradient(#eee0ff,#d3b6ff); }
  .bk.hl { background:linear-gradient(#8217ff,#5c0fd6); }

  /* ---------- controls ---------- */
  .controls { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin:12px 0; }
  .controls button, .controls select {
    background:#fff; color:var(--ink); border:2px solid var(--line);
    border-radius:999px; padding:9px 18px; cursor:pointer; font-size:.92rem; font-weight:700;
  }
  .controls button:hover { border-color:var(--brand); color:var(--brand); }
  .controls button.primary { background:linear-gradient(90deg,var(--brand),#9d4dff); color:#fff; border-color:transparent;
    box-shadow:0 4px 14px rgba(130,23,255,.35); }
  .controls button.primary:hover { filter:brightness(1.06); color:#fff; }
  .controls button:disabled { opacity:.5; cursor:not-allowed; }
  .progressbar { flex:1; min-width:160px; height:12px; background:#e9e2f7;
    border-radius:99px; overflow:hidden; }
  .progressbar i { display:block; height:100%; width:0;
    background:linear-gradient(90deg,var(--teal),var(--brand)); border-radius:99px; transition:width .2s; }
  .finishbox {
    background:linear-gradient(180deg,#fff,#f6efff); border:2px solid #e6d9ff; border-radius:var(--radius);
    padding:26px; text-align:center; margin-top:14px; box-shadow:var(--shadow-lg);
  }
  .finishbox .bigstars { font-size:2.6rem; letter-spacing:8px; color:#f5a623; text-shadow:0 2px 0 #ffcf70; }
  .finishbox .stat { color:var(--muted); margin-top:6px; }
  .finishbox .pass { color:#2ba55c; font-weight:800; margin-top:8px; font-size:1.05rem; }
  .finishbox .fail { color:#e28800; font-weight:800; margin-top:8px; }
  .hidden { display:none !important; }
  .lessonmeta { color:var(--muted); font-size:.85rem; }

  /* ---------- course map (winding path) ---------- */
  .cmap-band { position:relative; margin-bottom:6px; padding:12px 0 18px;
    background:linear-gradient(180deg,rgba(130,23,255,.05),rgba(130,23,255,0)); border-radius:var(--radius); }
  .cmap-band:nth-child(even) { background:linear-gradient(180deg,rgba(0,200,171,.05),rgba(0,200,171,0)); }
  .cmap-band-title { margin:6px 0 10px; }
  .cmap-row { display:flex; flex-wrap:wrap; gap:10px 14px; }
  .cmap-row.reverse { flex-direction:row-reverse; }
  .cmap-node { width:100px; text-align:center; cursor:pointer; padding:8px 4px 10px;
    border-radius:14px; transition:transform .15s; }
  .cmap-node:hover { transform:translateY(-3px) scale(1.03); }
  .cmap-node.locked { opacity:.5; cursor:default; filter:saturate(.5); }
  .cmap-node.locked:hover { transform:none; }
  .cmap-dot { width:52px; height:52px; margin:0 auto 6px; border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-weight:900; font-size:1.05rem;
    background:linear-gradient(180deg,#9d4dff,var(--brand)); color:#fff;
    border:3px solid #fff; box-shadow:0 4px 12px rgba(130,23,255,.35); }
  .cmap-node.complete .cmap-dot { background:linear-gradient(180deg,#57dd8f,#2ba55c);
    box-shadow:0 4px 12px rgba(43,165,92,.4); }
  .cmap-node.chordsc .cmap-dot { background:linear-gradient(180deg,#ff77b8,var(--chords)); }
  .cmap-node.leadc .cmap-dot { background:linear-gradient(180deg,#a55bff,var(--brand)); }
  .cmap-label { font-size:.74rem; line-height:1.25; color:var(--ink); font-weight:700; }
  .cmap-meta { font-size:.64rem; color:var(--muted); }
  .cmap-stars { font-size:.7rem; color:#f5a623; }

  footer { text-align:center; color:var(--muted); font-size:.82rem; padding:34px 0 50px; }
  footer button { vertical-align:middle; }
  code { background:#f0eafd; border-radius:6px; padding:1px 6px; font-size:.85em; color:var(--brand2); }

  /* ---------- progress ring + week strip ---------- */
  .ring { display:inline-flex; align-items:center; justify-content:center;
    width:52px; height:52px; border-radius:50%; vertical-align:middle; margin-right:6px;
    background:conic-gradient(var(--teal) calc(var(--pct)*1%), #e9e2f7 0);
    font-size:.8rem; }
  .ring b { display:flex; align-items:center; justify-content:center;
    width:40px; height:40px; border-radius:50%; background:#fff; color:var(--brand); font-weight:900; }
  .weekstrip { display:flex; align-items:flex-end; gap:10px; background:#fff;
    border-radius:var(--radius); box-shadow:var(--shadow); padding:12px 16px 10px;
    margin-bottom:18px; position:relative; }
  .wday { display:flex; flex-direction:column; align-items:center; gap:3px; width:30px; }
  .wday i { width:18px; border-radius:6px 6px 3px 3px; background:linear-gradient(180deg,var(--teal),var(--teal2)); min-height:4px; }
  .wday.today i { background:linear-gradient(180deg,var(--brand),#9d4dff); }
  .wday span { font-size:.66rem; color:var(--ink); font-weight:700; }
  .wday em { font-size:.6rem; color:var(--muted); font-style:normal; }
  .weeklbl { position:absolute; top:10px; right:14px; font-size:.72rem; color:var(--muted); font-weight:700; }

  /* ---------- mobile: keyboard always visible, compact chrome ---------- */
  .kb-sticky { position:sticky; bottom:0; z-index:9; margin:0 -16px; padding:8px 10px calc(10px + env(safe-area-inset-bottom,0px));
    background:linear-gradient(180deg,rgba(250,247,240,0),var(--bg) 30%); }
  @media (prefers-reduced-motion: reduce){
    * { animation:none !important; transition:none !important; }
  }
  @media (max-width:640px){
    main { padding:14px 10px 70px; }
    h1 { font-size:1.35rem; }
    .lessonhead h1 { font-size:1.2rem; }
    .controls button, .controls select { padding:8px 13px; font-size:.85rem; }
    .cmap-node { width:78px; }
    .recapbox { font-size:.8rem; padding:8px 12px; }
  }
</style>
</head>

<header class="app">
  <span class="logo">🎹 OpenPiano</span>
  <nav>
    <button data-view="home" class="active" aria-label="Home">Home</button>
    <button data-view="course">Course</button>
    <button data-view="songs">Songs</button>
    <button data-view="trainer">📖 Read Notes</button>
    <button data-view="sheet">🎼 Sheet Music</button>
    <button data-view="free">Free Play</button>
  </nav>
  <select id="locale" style="margin-left:auto">
    <option value="en">EN</option><option value="ru">RU</option><option value="es">ES</option>
  </select>
</header>

<main id="view"></main>

<footer>OpenPiano prototype · course engine + falling notes + good/ok grading + 80% pass gate ·
  <span id="sw-status"></span>
  <a href="https://github.com/itpick/openpiano">github.com/itpick/openpiano</a></footer>

<script>
/* PWA registration + robust update flow (the proven simpli-piano pattern):
   fetch version with no-store, unregister all SWs, clear caches, reload. */
if("serviceWorker" in navigator && location.protocol==="https:"){
  navigator.serviceWorker.register("./sw.js").then(reg=>{
    document.getElementById("sw-status").textContent="offline-ready ✓ ";
    const btn=document.createElement("button");
    btn.textContent="⟳ Update"; btn.className="back"; btn.style.cssText="padding:2px 10px;font-size:.75rem";
    btn.onclick=async()=>{
      btn.textContent="updating…";
      try{ const v=await fetch("./sw.js?u="+Date.now(),{cache:"no-store"}); }catch(e){}
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
      const keys=await caches.keys();
      await Promise.all(keys.map(k=>caches.delete(k)));
      location.replace("./?u="+Date.now());
    };
    document.getElementById("sw-status").after(btn," · ");
  }).catch(()=>{});
}
</script>

<script src="app/data.js"></script>
<script src="app/render.js"></script>
<script src="app/mic.js"></script>
<script src="app/midi.js"></script>
<script src="app/staff.js"></script>
<script src="app/hands.js"></script>

<script>
(() => {
"use strict";
const DATA = window.OPENPIANO_DATA;
const SONGS = DATA.songs, UNITS = DATA.units;
const NAMES = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
const view = document.getElementById("view");

/* ================= state (localStorage, per player) ================= */
const store = {
  get(k,d){ try{ const v=localStorage.getItem("openpiano."+k); return v==null?d:JSON.parse(v);}catch(e){return d;} },
  set(k,v){ localStorage.setItem("openpiano."+k, JSON.stringify(v)); }
};
/* profiles (like simpli-piano's profiles.js): up to 5 players, all progress
   namespaced by player id so nobody sees anybody else's stars */
const PROFILES_MAX = 5;
const EMOJIS = ["🎹","🎵","⭐","🎸","🦄","🚀","🐱","🐶","🌈","🎯"];
const profiles = store.get("profiles", { list: [], activeId: null });
function newPlayerId(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function activeProfile(){
  return profiles.list.find(p=>p.id===profiles.activeId) || null;
}
function pkey(base){ const p=activeProfile(); return base+"."+(p?p.id:"anon"); }
function ensurePlayer(){
  if(!activeProfile()){ addPlayer("Player 1"); }
}
function addPlayer(name){
  const id=newPlayerId();
  profiles.list.push({id, name, emoji: EMOJIS[profiles.list.length % EMOJIS.length], created: Date.now()});
  profiles.activeId=id; store.set("profiles", profiles);
  return id;
}
function switchPlayer(id){ profiles.activeId=id; store.set("profiles", profiles); }
function removePlayer(id){
  profiles.list=profiles.list.filter(p=>p.id!==id);
  if(profiles.activeId===id) profiles.activeId=profiles.list[0]?.id||null;
  store.set("profiles", profiles);
  // orphan all per-player keys
  const pkeys=[];
  for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i);
    if(k&&k.includes("."+id)) pkeys.push(k); }
  pkeys.forEach(k=>localStorage.removeItem(k));
}
ensurePlayer();

const prog = store.get(pkey("course"), {}); // {unitId: {stars, complete}}
const songProg = store.get(pkey("songs"), {}); // {songId: {stars, bestAccuracy}}
const stats = store.get(pkey("stats"), { days:{}, goalMin:10 }); // practice seconds/day
const onboard = store.get(pkey("onboard"), {}); // {done, goal, exp, minutes}
const saveProg = () => { store.set(pkey("course"), prog); store.set(pkey("songs"), songProg);
  store.set(pkey("stats"), stats); store.set(pkey("onboard"), onboard); };

/* ---- stats: local-day practice seconds, streak (≥60s counts), goal ---- */
function dayKey(off=0){ const d=new Date(); d.setDate(d.getDate()-off);
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function logPractice(secs){
  const k=dayKey(); stats.days[k]=(stats.days[k]||0)+Math.round(secs);
  store.set(pkey("stats"), stats);
}
function streak(){
  let s=0;
  for(let i=0;i<3650;i++){ const secs=stats.days[dayKey(i)]||0;
    if(secs>=60) s++;
    else { if(i===0) continue; break; } // today may still be 0 — don't break yesterday's streak
  }
  return s;
}
function todayMinutes(){ return Math.round((stats.days[dayKey()]||0)/60); }

/* ================= course helpers (course.js semantics) ================= */
const PASS = 0.8;
const tierName = {beginner:"Beginner", intermediate:"Intermediate", "chords-basics":"Chord Basics", "chords-prog":"Progressions", "lead-sheet":"Lead Sheet"};
const unitComplete = id => !!(prog[id] && prog[id].complete);
const unitUnlocked = i => i<=0 || unitComplete(UNITS[i-1].id);
const nextUnitIndex = () => { for(let i=0;i<UNITS.length;i++) if(unitUnlocked(i)&&!unitComplete(UNITS[i].id)) return i; return -1; };
const songOf = id => SONGS.find(s=>s.id===id);
const starRow = n => "★★★".slice(0,n)+"☆☆☆".slice(0,3-n);

/* ================= audio (two detuned oscillators + ADSR) ================= */
let actx=null, master=null; const voices=new Map();
function ensureAudioCtx(){
  if(!actx){ actx=new (window.AudioContext||window.webkitAudioContext)();
    master=actx.createGain(); master.gain.value=0.32; master.connect(actx.destination); }
  if(actx.state==="suspended") actx.resume();
  return actx;
}
window.__op={ get ctx(){ return actx; }, ensureCtx: ensureAudioCtx };
/* e2e probe: sound a note through the app's own synth so the mic can prove
   echo suppression (the app must NOT grade its own speaker output). */
window.__opEchoProbe=function(){ synthNote(69,0.8,90); };
function ensureCtx(){
  if(!actx){ actx=new (window.AudioContext||window.webkitAudioContext)();
    master=actx.createGain(); master.gain.value=0.32; master.connect(actx.destination); }
  if(actx.state==="suspended") actx.resume();
}
function midiFreq(m){ return 440*Math.pow(2,(m-69)/12); }
function synthNote(midi, durBeats=1, bpm=90){
  ensureCtx();
  const t=actx.currentTime, f=midiFreq(midi), secs=Math.max(0.25, durBeats*60/bpm);
  // echo-suppression stamp: the mic must ignore our own speaker. Stamp at onset
  // and again at the audible decay end (~0.6s) — NOT at note-end, or fast
  // same-pitch repeats get swallowed by the echo window.
  if(window.Mic) window.Mic.stampEcho(midi);
  setTimeout(()=>{ if(window.Mic) window.Mic.stampEcho(midi); }, Math.min(secs*600, 900));
  // richer piano-ish voice: fundamental (triangle) + soft 2nd harmonic + hammer
  // blip — still zero samples, but less thin than a bare dual-triangle
  const o1=actx.createOscillator(), o2=actx.createOscillator(), o3=actx.createOscillator(), g=actx.createGain();
  o1.type="triangle"; o2.type="sine"; o3.type="sine";
  o1.frequency.value=f; o2.frequency.value=f*2; o3.frequency.value=f*3;
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(0.42,t+0.008);
  g.gain.setValueAtTime(0.36,t+secs*0.55);
  g.gain.exponentialRampToValueAtTime(0.0001,t+secs+0.35);
  const g2=actx.createGain(); g2.gain.value=0.35;   // 2nd harmonic
  const g3=actx.createGain(); g3.gain.value=0.10;   // 3rd
  o1.connect(g); o2.connect(g2); g2.connect(g); o3.connect(g3); g3.connect(g);
  g.connect(master);
  // hammer attack: tiny filtered noise blip
  const n=actx.createBufferSource(); n.buffer=getNoise();
  const nf=actx.createBiquadFilter(); nf.type="bandpass"; nf.frequency.value=f*4; nf.Q.value=1;
  const ng=actx.createGain(); ng.gain.setValueAtTime(0.12,t); ng.gain.exponentialRampToValueAtTime(0.0001,t+0.02);
  n.connect(nf); nf.connect(ng); ng.connect(master); n.start(t); n.stop(t+0.03);
  o1.start(t); o2.start(t); o3.start(t);
  o1.stop(t+secs+0.4); o2.stop(t+secs+0.4); o3.stop(t+secs+0.4);
}
/* ---- backing track: simple bass accompaniment under the melody ----
 * Superseded by THE BAND (auto-harmonized full arrangement) above; kept
 * name-compatible for the moving-mode call site. */
function backingChordBar(pattern, bar, t, barSecs){
  const roots={ "c-g":[ [48,55,64], [43,55,62] ],  // C: C3 G3 E4 / G: G2 G3 D4
                "c-am-f-g":[ [48,55,64],[45,52,60],[41,53,60],[43,55,62] ] };
  const seq=roots[pattern]||roots["c-g"];
  const chord=seq[bar % seq.length];
  chord.forEach((m,i)=>{
    const o=actx.createOscillator(), g=actx.createGain();
    o.type="sine"; o.frequency.value=midiFreq(m);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.09,t+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t+barSecs*0.95);
    o.connect(g); g.connect(master); o.start(t); o.stop(t+barSecs);
  });
}
function playBacking(pattern, bpm, totalBeats, countIn){
  const barBeats=4, barSecs=barBeats*60/bpm;
  const t0=actx.currentTime + countIn*(60/bpm);
  const bars=Math.ceil(totalBeats/barBeats);
  for(let b=0;b<bars;b++) backingChordBar(pattern, b, t0+b*barSecs, barSecs);
}

/* ---- THE BAND: auto-harmonized backing track (the Simply Piano layer) ----
 * Simply never makes you play over a bare metronome: every play-along runs
 * over bass + chords + drums. We derive the chord progression from the
 * song's own melody per bar (auto-harmonization), then schedule a full
 * arrangement on the AudioContext clock.
 *   - moving mode: full band synced to the count-in
 *   - step mode:   the band ANSWERS each correct note with a stab
 *   - everything routes through bandBus() so finish()/exit can duck it out */
let bandGain=null, bandNodes=[], noiseBuffer=null;
function bandBus(){
  if(!bandGain){ bandGain=actx.createGain(); bandGain.gain.value=0.9; bandGain.connect(master); }
  return bandGain;
}
function stopBand(){
  if(bandGain){ const g=bandGain; bandGain=null;
    g.gain.setTargetAtTime(0.0001, actx.currentTime, 0.04);
    setTimeout(()=>{ try{g.disconnect();}catch(e){} },400); }
  bandNodes.forEach(n=>{ try{n.stop();}catch(e){} }); bandNodes=[];
}
function getNoise(){
  if(!noiseBuffer){
    noiseBuffer=actx.createBuffer(1, actx.sampleRate*0.25, actx.sampleRate);
    const d=noiseBuffer.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  }
  return noiseBuffer;
}
function drumKick(t){
  const g=bandBus(), o=actx.createOscillator(), env=actx.createGain();
  o.type="sine"; o.frequency.setValueAtTime(150,t); o.frequency.exponentialRampToValueAtTime(48,t+0.09);
  env.gain.setValueAtTime(0.42,t); env.gain.exponentialRampToValueAtTime(0.0001,t+0.12);
  o.connect(env); env.connect(g); o.start(t); o.stop(t+0.14);
}
function drumSnare(t){
  const g=bandBus(), s=actx.createBufferSource(), f=actx.createBiquadFilter(), env=actx.createGain();
  s.buffer=getNoise(); f.type="highpass"; f.frequency.value=1800;
  env.gain.setValueAtTime(0.16,t); env.gain.exponentialRampToValueAtTime(0.0001,t+0.09);
  s.connect(f); f.connect(env); env.connect(g); s.start(t); s.stop(t+0.1);
}
function drumHat(t, vol=0.06){
  const g=bandBus(), s=actx.createBufferSource(), f=actx.createBiquadFilter(), env=actx.createGain();
  s.buffer=getNoise(); f.type="highpass"; f.frequency.value=8000;
  env.gain.setValueAtTime(vol,t); env.gain.exponentialRampToValueAtTime(0.0001,t+0.03);
  s.connect(f); f.connect(env); env.connect(g); s.start(t); s.stop(t+0.04);
}
function bandNote(midi, t, durSecs, vol, type="sine"){
  const g=bandBus(), o=actx.createOscillator(), env=actx.createGain();
  o.type=type; o.frequency.value=midiFreq(midi);
  env.gain.setValueAtTime(0.0001,t);
  env.gain.exponentialRampToValueAtTime(vol,t+0.02);
  env.gain.exponentialRampToValueAtTime(0.0001,t+durSecs);
  o.connect(env); env.connect(g); o.start(t); o.stop(t+durSecs+0.05);
  bandNodes.push(o);
}
/* auto-harmonize: best diatonic triad per 4-beat bar (downbeat weighted).
 * Candidates ordered I, V, IV, vi, ii, iii — ties prefer the more common
 * progression degree, which keeps simple tunes sounding right. */
const CHORDS=[ {pc:0,int:[0,4,7],min:false},{pc:7,int:[0,4,7],min:false},
  {pc:5,int:[0,4,7],min:false},{pc:9,int:[0,3,7],min:true},
  {pc:2,int:[0,3,7],min:true},{pc:4,int:[0,3,7],min:true} ];
function harmonize(layout,totalBeats){
  const bars=Math.max(1,Math.ceil(totalBeats/4));
  const out=[];
  for(let b=0;b<bars;b++){
    const lo=b*4, hi=lo+4, pcs=[];
    layout.forEach(s=>{ if(s.rest) return;
      if(s.startBeat>=lo && s.startBeat<hi){
        (Array.isArray(s.midi)?s.midi:[s.midi]).forEach(m=>{
          const w = s.startBeat===lo ? 2 : 1;      // downbeat weighs double
          for(let k=0;k<w;k++) pcs.push(((m%12)+12)%12);
        });
      }
    });
    let best=CHORDS[0], bestScore=-Infinity;
    CHORDS.forEach(c=>{
      const triad=new Set(c.int.map(i=>(c.pc+i)%12));
      let score=0; pcs.forEach(p=>{ score += triad.has(p)?1:-0.5; });
      if(score>bestScore){ bestScore=score; best=c; }
    });
    out.push({ rootPc:best.pc, triad:best.int.map(i=>(best.pc+i)%12),
               minor:best.min, startBeat:lo });
  }
  return out;
}
/* one-shot stab (step mode): the band answers each correct note */
function bandStab(bar, bpm){
  const t=actx.currentTime+0.01, c=bar;
  const bassRoot=36+c.rootPc;
  bandNote(bassRoot, t, 0.5, 0.15, "sine");
  c.triad.forEach((pc,i)=> bandNote(60+pc, t+0.015*i, 0.55, 0.045, "triangle"));
  drumHat(t, 0.05);
}
/* full arrangement (moving mode): bass, pad, drums per bar */
function playFullBacking(bars, bpm, countIn){
  const spb=60/bpm, barSecs=4*spb;
  const t0=actx.currentTime + countIn*spb;
  bars.forEach((c,bi)=>{
    const t=t0+bi*barSecs;
    drumKick(t); drumKick(t+2*spb);
    drumSnare(t+1*spb); drumSnare(t+3*spb);
    for(let hb=0;hb<4;hb++) drumHat(t+hb*spb, 0.045);
    bandNote(36+c.rootPc, t, spb*1.8, 0.16, "sine");                 // bass root
    bandNote(36+((c.rootPc+7)%12), t+2*spb, spb*1.8, 0.13, "sine");  // fifth
    c.triad.forEach(pc=> bandNote(48+pc, t, barSecs*0.95, 0.035, "triangle")); // pad
  });
}

let metroTimer=null, metroStartT=0;
function metronome(bpm, beats, onTick, onDone){
  ensureCtx();
  const msPerBeat=60000/bpm;
  // schedule every click on the AudioContext clock (sample-accurate, no
  // setInterval drift) — the visual tick callback is the fallback timer
  metroStartT=actx.currentTime;
  for(let b=0;b<beats;b++){
    const t=metroStartT+b*msPerBeat/1000;
    const o=actx.createOscillator(), g=actx.createGain();
    o.type="square"; o.frequency.value= b%4===0?1568:1046;
    g.gain.setValueAtTime(0.08,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.05);
    o.connect(g); g.connect(master); o.start(t); o.stop(t+0.06);
  }
  let beat=0;
  const tick=()=>{
    if(onTick) onTick(beat);
    beat++;
    if(beat>=beats){ stopMetro(); if(onDone) onDone(); }
  };
  tick();
  metroTimer=setInterval(tick, msPerBeat);
}
function stopMetro(){ if(metroTimer){ clearInterval(metroTimer); metroTimer=null; } }
function metroStartPerf(){ // performance.now() aligned to the metronome's beat 0
  return metroStartT ? performance.now() - (actx.currentTime - metroStartT)*1000 : performance.now();
}

/* ================= keyboard ================= */
const WHITE=m=>![1,3,6,8,10].includes(((m%12)+12)%12);
let kbShift=0;
const keyEls={};
function buildKB(kbEl, lo, hi){
  kbEl.innerHTML=""; for(const k in keyEls) delete keyEls[k];
  const whites=[], blacks=[];
  for(let m=lo;m<=hi;m++) (WHITE(m)?whites:blacks).push(m);
  whites.forEach(m=>{
    const el=document.createElement("div"); el.className="wk"; el.dataset.midi=m; el.setAttribute("role","button"); el.setAttribute("aria-label","piano key " + NAMES[m%12]);
    el.innerHTML=`<span class="lbl">${NAMES[m%12]}</span>`;
    kbEl.append(el); keyEls[m]=el;
  });
  const wW=100/whites.length;
  blacks.forEach(m=>{
    const left=whites.filter(w=>w<m).length;
    const el=document.createElement("div"); el.className="bk"; el.dataset.midi=m; el.setAttribute("role","button"); el.setAttribute("aria-label","piano key " + NAMES[m%12]);
    // real-piano ratio: black ≈ 58% of a white key's width, centered on the
    // boundary between its two neighbors
    const bw=wW*0.58;
    el.style.width=bw+"%";
    el.style.left=(left*wW - bw/2)+"%";
    el.innerHTML=`<span class="lbl">${NAMES[m%12]}</span>`;
    kbEl.append(el); keyEls[m]=el;
  });
}
function keyEl(m){ return keyEls[m]; }
function hlKey(m,on){ const el=keyEls[m]; if(el) el.classList.toggle("hl",!!on); }
function clearHl(){ document.querySelectorAll(".hl").forEach(el=>el.classList.remove("hl")); }

/* pointer + computer keyboard input */
function wireKB(kbEl, onInput){
  let down=false; const active=new Map();
  const midiAt=e=>{ const el=document.elementFromPoint(e.clientX,e.clientY);
    return el&&el.dataset&&el.dataset.midi?+el.dataset.midi:null; };
  kbEl.addEventListener("pointerdown",e=>{ down=true; try{ kbEl.setPointerCapture(e.pointerId);}catch(err){}
    const m=midiAt(e); if(m!=null){ active.set(e.pointerId,m); press(m);} });
  kbEl.addEventListener("pointermove",e=>{ if(!down) return;
    const prev=active.get(e.pointerId), m=midiAt(e);
    if(m!==prev){ if(prev!=null) release(prev);
      if(m!=null){ active.set(e.pointerId,m); press(m);} else active.delete(e.pointerId); } });
  const up=e=>{ const prev=active.get(e.pointerId); if(prev!=null) release(prev);
    active.delete(e.pointerId); if(!active.size) down=false; };
  kbEl.addEventListener("pointerup",up); kbEl.addEventListener("pointercancel",up);

  const KEYMAP={a:0,w:1,s:2,e:3,d:4,f:5,t:6,g:7,y:8,h:9,u:10,j:11,k:12,o:13,l:14,p:15,";":16};  const held=new Set();
  const kd=e=>{ if(e.repeat||e.target.tagName==="SELECT"||e.target.tagName==="INPUT") return;
    const off=KEYMAP[e.key.toLowerCase()]; if(off==null) return;
    const m=kbLo()+off; if(held.has(m)) return; held.add(m); press(m); };
  const ku=e=>{ const off=KEYMAP[e.key.toLowerCase()]; if(off==null) return;
    const m=kbLo()+off; if(held.has(m)){ held.delete(m); release(m);} };
  let kbLoFn=()=>60;
  function kbLo(){ return kbLoFn(); }
  window.addEventListener("keydown",kd); window.addEventListener("keyup",ku);
  function press(m){ visual(m,true); onInput&&onInput(m,true); }
  function release(m){ visual(m,false); onInput&&onInput(m,false); }
  function visual(m,downv){ synthNotePress(m,downv); }
  return { setLo:(fn)=>{ kbLoFn=fn; }, cleanup(){ window.removeEventListener("keydown",kd); window.removeEventListener("keyup",ku); } };
}

/* live synth tied to key visuals (sustains while held) */
const liveVoices=new Map();
function synthNotePress(m,down){
  ensureCtx();
  if(down){
    if(liveVoices.has(m)) return;
    const t=actx.currentTime, f=midiFreq(m);
    const o1=actx.createOscillator(), o2=actx.createOscillator(), g=actx.createGain();
    o1.type="triangle"; o2.type="triangle";
    o1.frequency.value=f; o2.frequency.value=f*1.003;
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.45,t+0.012);
    o1.connect(g); o2.connect(g); g.connect(master);
    o1.start(t); o2.start(t);
    liveVoices.set(m,{o1,o2,g});
    const el=keyEl(m); if(el) el.classList.add("down");
  } else {
    const v=liveVoices.get(m); if(!v) return;
    const t=actx.currentTime;
    v.g.gain.cancelScheduledValues(t); v.g.gain.setTargetAtTime(0.0001,t,0.09);
    setTimeout(()=>{ try{v.o1.stop();v.o2.stop();}catch(e){} },450);
    liveVoices.delete(m);
    const el=keyEl(m); if(el) el.classList.remove("down");
  }
}

/* motivational callout on every finish overlay (Simply pattern; simpli-piano stats.js) */
function motivate(stars, passed){
  const st=streak(), today=todayMinutes(), goal=stats.goalMin||10;
  if(today>=goal && st>=2) return `🔥 ${st}-day streak — daily goal already hit (${today}/${goal} min). Legend.`;
  if(today>=goal) return `Daily goal hit (${today}/${goal} min). Keep the 🔥 alive tomorrow!`;
  if(today+3>=goal) return `Almost at today's goal — ${Math.max(goal-today,1)} more min and the streak grows!`;
  if(stars===3) return `Perfect run! 🔥 streak: ${st} day${st===1?"":"s"} · ${today}/${goal} min today`;
  if(passed) return `Well played — ${today}/${goal} min today. 🔥 ${st}-day streak`;
  return `Every replay counts — ${today}/${goal} min toward today's goal.`;
}

/* ---------- ONBOARDING (Simply's intro funnel: 3 taps → plan) ---------- */
function onboardView(){
  setView("home"); stopMetro(); clearHl();
  const QUESTIONS=[
    {key:"goal", title:"Why do you want to play piano?", sub:"There's no wrong answer — this shapes your plan.",
     options:[["songs","🎵","Play songs I love"],["relax","🌙","Relax and unwind"],["challenge","🏆","Challenge myself"]]},
    {key:"exp", title:"Have you played before?", sub:"We'll start you in the right place.",
     options:[["new","🌱","Brand new"],["some","🌿","I know a little"],["played","🌳","I've played before"]]},
    {key:"minutes", title:"Practice how long each day?", sub:"Short and steady beats long and rare.",
     options:[[5,"⏱","5 minutes"],[10,"⏲","10 minutes"],[15,"⏰","15 minutes"]]},
  ];
  const answers={};
  function ask(qi){
    if(qi>=QUESTIONS.length){ finish(); return; }
    const q=QUESTIONS[qi];
    view.innerHTML=`<h1>${q.title}</h1><p class="sub">${q.sub}</p>
      <div class="grid">${q.options.map(([v,e,l])=>
        `<div class="card" data-v="${v}"><h3 style="font-size:1.6rem">${e}</h3><h3>${l}</h3></div>`).join("")}</div>

    const sk=document.getElementById("ob-skip");

    const bk=document.getElementById("ob-back");
    if(bk) bk.onclick=()=>ask(qi-1);

    onboard.done=true; Object.assign(onboard, answers);
    const mins=parseInt(answers.minutes,10); if(mins) stats.goalMin=mins;
    saveProg();
    homeView();
  }

}

    band.append(h);
    const row=document.createElement("div"); row.className="cmap-row";
    if(ti%2===1) row.classList.add("reverse");
    items.forEach(({u,i},k)=>{
      const p=prog[u.id]||{}; const unlocked=unitUnlocked(i);
      const node=document.createElement("div");
      node.className="cmap-node "+(unlocked?"":"locked ")+(u.tier.startsWith("chords")?"chordsc":"")+(u.tier==="lead-sheet"?" leadc":"");
      node.style.animationDelay=(k*0.04)+"s";
      const s=songOf(u.song);
      const meta = u.type==="song"&&s ? s.title : (u.type==="trainer"?"reading drill":"key drill");
      node.innerHTML=`<div class="cmap-dot">${unitComplete(u.id)?"★":(unlocked?(k+1):"🔒")}</div>
        <div class="cmap-label">${u.title}</div>
        <div class="cmap-meta">${meta}</div>
        ${p.stars?`<div class="cmap-stars">${starRow(p.stars)}</div>`:""}`;
      if(unlocked) node.onclick=()=>lessonView(u.id);
      row.append(node);
    });
    band.append(row);
    map.append(band);
  });
}

/* ---------- LESSON (the engine) ---------- */
let L=null; // live lesson state
function lessonView(unitId, opts){
  setView(unitId?"course":(opts&&opts.fromSongs?"songs":"home"));
  stopMetro(); clearHl();
  const u=unitId?UNITS.find(x=>x.id===unitId):null;
  // keyfind/trainer units have no library song — synthesize a drill song from
  // the unit data (mirrors simpli-piano's trainer/keyfind lesson plumbing)
  let song;
  if (opts&&opts.song) song=opts.song;
  else if (u&&u.song) song=songOf(u.song);
  else if (u&&u.type==="keyfind"){
    // random-order key finding: u.notes shuffled, goal repetitions
    const notes=(u.notes||[60,62,64]).slice();
    const seq=[]; for(let i=0;i<(u.goal||6);i++) seq.push(notes[Math.floor(Math.random()*notes.length)]);
    song={id:"drill-"+u.id,title:u.title,difficulty:1,tempo:88,genre:"exercise",
          steps:seq.map(m=>({midi:m,beats:1})),lo:Math.min(...seq),hi:Math.max(...seq)};
  } else if (u&&u.type==="trainer"){
    // staff-reading drill: fixedNotes in random order (staff rendering TODO)
    const notes=(u.fixedNotes||[60,62,64]).slice();
    const seq=[]; for(let i=0;i<(u.goal||8);i++) seq.push(notes[Math.floor(Math.random()*notes.length)]);
    song={id:"drill-"+u.id,title:u.title,difficulty:1,tempo:84,genre:"exercise",
          steps:seq.map(m=>({midi:m,beats:1})),lo:Math.min(...seq),hi:Math.max(...seq),clef:u.clef};
  } else song=SONGS[0];
  const mode=opts&&opts.mode?opts.mode:(u&&u.mode==="moving"?"moving":"step");  const backLabel=u?"← Course":(opts&&opts.fromSongs?"← Songs":"← Home");

  view.innerHTML=`<button class="back">${backLabel}</button>
    <div class="lessonhead">
      <h1>${u?u.title:song.title}</h1>
      <span class="lessonmeta">${song.tempo} BPM · ${mode==="moving"?"moving — play in time":"step — waits for you"}
        ${u?` · ${tierName[u.tier]}`:""}</span>
    </div>
    <div id="l-recap"></div>
    <div class="lane" id="lane" role="img" aria-label="Falling notes lane"><div class="hitline"></div></div>
    <div class="controls">
      <button id="l-demo">▶︎ Demo</button>
      <button id="l-start" class="primary">${window.I18N.t("lesson.start")}</button>
      <button id="l-restart" class="hidden">${window.I18N.t("lesson.restart")}</button>
      <button id="l-listen">${window.I18N.t("lesson.listen")}</button>
      <button id="l-mic" title="Play your real piano — the app listens and grades">${window.I18N.t("lesson.mic")}</button>
      <button id="l-midi" title="Connect a MIDI keyboard via USB — perfect recognition">${window.I18N.t("lesson.midi")}</button>
      <button id="l-hands" title="Show hand/finger overlay (typing-tutor style)">${window.I18N.t("lesson.hands")}</button>
      <div class="progressbar"><i id="l-prog"></i></div>
      <span class="lessonmeta" id="l-status"></span>
    </div>
    <div id="l-finish"></div>`;
  view.querySelector(".back").onclick=()=>{ stopMic(); stopMetro(); stopBand(); u?courseView():(opts&&opts.fromSongs?songsView():homeView()); };

  // ---- recap: review the previous unit (Simply's lesson-recap pattern) ----
  if(u){
    const idx=UNITS.findIndex(x=>x.id===u.id);
    const prev=idx>0?UNITS[idx-1]:null;
    const recapEl=view.querySelector("#l-recap");
    if(prev){
      const prevSong=prev.song?songOf(prev.song):null;
      recapEl.innerHTML=`<div class="recapbox">
        <b>Quick recap:</b> last time — ${prev.title}${prevSong?` (${prevSong.title})`:""}.
        <button class="back" id="recap-replay" style="margin-left:8px;padding:3px 10px;font-size:.8rem">↻ Replay it</button>
        <span class="lessonmeta" id="recap-note"></span>
      </div>`;
      document.getElementById("recap-replay").onclick=()=>lessonView(prev.id);
    } else {
      recapEl.innerHTML=`<div class="recapbox"><b>Welcome!</b> This is your first lesson — find the keys the app lights up.</div>`;
    }
  }

  // ---- build the falling lane ----
  const lane=view.querySelector("#lane");
  const PPB=44, HIT=10;
  let beat=0;
  const layout=song.steps.map(st=>{ const s={...st,startBeat:beat}; beat+=st.beats; return s; });
  const totalBeats=beat;
  const notes=layout.filter(s=>!s.rest);
  notes.forEach((s,i)=>s.idx=i);
  const kbTop=()=>lane.clientHeight; // px of hit line
  // ---- keyboard range derived from the ACTUAL notes in the song (chord
  // tops included — stored lo/hi under-report for chords). Cap the span at
  // ~2 octaves so keys stay tappable on phones; >=8 whites minimum. ----
  let loN=Infinity, hiN=-Infinity;
  layout.forEach(s=>{ if(s.rest) return;
    (Array.isArray(s.midi)?s.midi:[s.midi]).forEach(m=>{ if(m<loN)loN=m; if(m>hiN)hiN=m; }); });
  let kbLo=48, kbHi=84;
  if(isFinite(loN)){
    kbLo=loN-2; while(!WHITE(kbLo)) kbLo--;
    kbHi=hiN+2; while(!WHITE(kbHi)) kbHi++;
    const whites=(a,b)=>{let n=0;for(let m=a;m<=b;m++) if(WHITE(m)) n++; return n;};
    while(whites(kbLo,kbHi)<8){ kbLo--; while(!WHITE(kbLo)) kbLo--; }
    // cap span: if more than 15 whites, trim from the side with more slack
    while(whites(kbLo,kbHi)>15){
      if(kbLo>21 && kbLo<loN-4) { kbLo++; while(!WHITE(kbLo)) kbLo++; }
      else if(kbHi<108 && kbHi>hiN+4){ kbHi--; while(!WHITE(kbHi)) kbHi--; }
      else break;
    }
    if(kbLo<21) kbLo=21;
  }
  // ---- fingering: map melody notes to RH finger numbers (1 thumb … 5 pinky)
  // within the song's home 5-finger position (Simply teaches this per song) ----
  const homeLo = (()=>{ const pcs=new Set(); layout.forEach(s=>{ if(s.rest) return;
    (Array.isArray(s.midi)?s.midi:[s.midi]).forEach(m=>pcs.add(((m%12)+12)%12)); });
    // choose C-based position covering the song when possible
    for(const start of [60,55,48]){ const set=new Set(); for(let m=start;m<start+9;m++) if(WHITE(m)) set.add(m%12);
      if([...pcs].every(p=>set.has(p))) return start; }
    return 60; })();
  const fingerOf=(m)=>{ const rel=m-homeLo;
    const map={0:1,2:2,4:3,5:4,7:5,9:5,11:5, 1:1,3:1,6:1,8:1,10:1};
    return map[((rel%12)+12)%12] || Math.min(5,Math.max(1,Math.round(rel/2)+1)); };
  L={ unitId, song, mode, layout, totalBeats, notes, cursor:0, mistake:false,
      good:0, ok:0, missed:0, running:false, startT:0, playhead:0, raf:null, listenTimers:[],
      bars:harmonize(layout,totalBeats) };  // band chords precomputed per bar
  // sticky keyboard wrapper: the keys stay visible while the lane scrolls
  const kbSticky=document.createElement("div"); kbSticky.className="kb-sticky";
  view.append(kbSticky);
  mountKBInto(kbSticky, kbLo, kbHi, onInput);
  window.Hands.mount(view.querySelector(".kb"));

  // mic input: always share the app's AudioContext so the virtual-mic stream and
  // the analyser live on the same clock (real devices: same context = same latency)
  window.Mic.useContext(ensureAudioCtx());
  let inputSource="tap";
  const micBtn=view.querySelector("#l-mic");
  // chords are tap-only: the mic is monophonic (ACF2+); chord detection is the
  // commercial app's MusicSense moat (see research/simpli-piano-coniker)
  const hasChords=layout.some(s=>!s.rest&&Array.isArray(s.midi));
  if(hasChords){ micBtn.disabled=true; micBtn.title="Chords are graded by tapping — the mic grades single notes only"; }
  micBtn.onclick=async()=>{
    ensureCtx();
    if(inputSource==="mic"){ stopMic(); inputSource="tap"; micBtn.classList.remove("primary"); return; }
    micBtn.textContent="🎤 starting…";
    try{
      await window.Mic.start(m=>{
        synthNotePress(m,true); setTimeout(()=>synthNotePress(m,false),150);
        onInput(m,true);
      });
      inputSource="mic"; micBtn.classList.add("primary"); micBtn.textContent="🎤 listening (tap to stop)";
      view.querySelector("#l-status").textContent="mic on — play on your real piano";
    }catch(err){
      micBtn.textContent="🎤 mic unavailable";
      view.querySelector("#l-status").textContent="mic error: "+err.message;
      setTimeout(()=>{ micBtn.textContent=window.I18N.t("lesson.mic"); },3000);
    }
  };
  function stopMic(){ if(window.Mic&&window.Mic.info().running){ window.Mic.stop();
    if(micBtn){ micBtn.classList.remove("primary"); micBtn.textContent=window.I18N.t("lesson.mic"); } inputSource="tap"; } }
  if(L) L.stopMic=stopMic;

  // ---- MIDI input (Phase C): cable input beats the mic for accuracy ----
  const midiBtn=view.querySelector("#l-midi");
  let midiOn=false;
  midiBtn.onclick=async()=>{
    if(midiOn){ window.Midi.stop(); midiOn=false; inputSource="tap";
      midiBtn.classList.remove("primary"); midiBtn.textContent="🎚 MIDI"; return; }
    try{
      const name=await window.Midi.start((m,down)=>{
        synthNotePress(m,down); onInput(m,down);
      });
      midiOn=true; inputSource="midi"; midiBtn.classList.add("primary");
      midiBtn.textContent="🎚 "+(name||"MIDI");
      stopMic();
    }catch(err){
      midiBtn.textContent="🎚 unavailable";
      view.querySelector("#l-status").textContent="MIDI error: "+err.message;
      setTimeout(()=>{ midiBtn.textContent="🎚 MIDI"; },3000);
    }
  };
  if(!window.Midi.available()){ midiBtn.disabled=true; midiBtn.title="Web MIDI needs Chrome/Edge over HTTPS"; }

  // ---- hands overlay (default OFF — the UX rule from the research) ----
  const handsBtn=view.querySelector("#l-hands");
  handsBtn.onclick=()=>{
    window.Hands.show(!window.Hands.visible);
    handsBtn.classList.toggle("primary", window.Hands.visible);
  };

  function drawBlocks(){
    lane.querySelectorAll(".block").forEach(el=>el.remove());
    layout.forEach(s=>{
      if(s.rest) return;
      const el=document.createElement("div");
      el.className="block "+(Array.isArray(s.midi)?"chord":"pending");
      el.dataset.idx=s.idx;
      const h=Math.max(18,s.beats*PPB-4);
      el.style.height=h+"px";
      el.style.width=lane.clientWidth*0.16+"px";
      el.style.left=(6+ (s.idx%4)*0.2*lane.clientWidth )+"px";
      el.style.bottom=(HIT + s.startBeat*PPB)+"px";
      const fn=Array.isArray(s.midi)?s.midi.map(m=>fingerOf(m)).join("+"):fingerOf(s.midi);
      el.textContent=Array.isArray(s.midi)?s.midi.map(m=>NAMES[m%12]).join("+"):NAMES[s.midi%12];
      el.innerHTML+=` <span style="opacity:.8;font-size:.62rem">·${fn}</span>`;
      lane.append(el);
    });
  }
  drawBlocks();
  window.addEventListener("resize",drawBlocks);

  function tickLoop(){
    if(!L.running) return;
    const msPerBeat=60000/L.bpm;
    const now=performance.now();
    // playhead relative to beat 0 (count-in makes it negative)
    L.playhead=(now-L.startT)/msPerBeat - (L.countIn||0);
    // move blocks
    lane.querySelectorAll(".block").forEach(el=>{
      const s=layout.find(x=>String(x.idx)===el.dataset.idx);
      if(!s) return;
      el.style.bottom=(HIT + (s.startBeat-L.playhead)*PPB)+"px";
    });
    // miss detection (moving mode)
    if(L.mode==="moving"){
      const cur=L.notes[L.cursor];
      if(cur && L.playhead>cur.startBeat+cur.beats+0.4){
        markMissed(cur); L.cursor++; L.missed++;
        updateStatus();
        // Simply's recovery: after 4 consecutive misses, rewind ~2 bars and
        // replay that section instead of letting the song fall apart
        L.consecMiss=(L.consecMiss||0)+1;
        if(L.consecMiss>=4){
          L.consecMiss=0;
          let ni=L.notes.findIndex(n=>n.startBeat>=Math.max(0,cur.startBeat-8));
          if(ni<0) ni=0;
          L.cursor=ni;
          L.notes.slice(L.cursor).forEach(s=>{
            const el=lane.querySelector(`.block[data-idx="${s.idx}"]`);
            if(el){ el.classList.remove("done-good","done-ok","missed"); el.classList.add(Array.isArray(s.midi)?"chord":"pending"); }
          });
          view.querySelector("#l-status").textContent="↺ rewind — try this section again";
          setTimeout(updateStatus,1200);
        }
        if(L.cursor>=L.notes.length) finish();
      }
    }
    L.raf=requestAnimationFrame(tickLoop);
  }

  function markMissed(s){ const el=lane.querySelector(`.block[data-idx="${s.idx}"]`);
    if(el) el.classList.replace(el.className.match(/pending|chord/)[0],"missed"); }
  function gradeBlock(s,cls){ const el=lane.querySelector(`.block[data-idx="${s.idx}"]`);
    if(el){ el.classList.remove("pending","chord"); el.classList.add(cls); } }

  function updateStatus(){
    const done=L.cursor, total=L.notes.length;
    view.querySelector("#l-prog").style.width=(done/total*100)+"%";
    view.querySelector("#l-status").textContent=`${done} / ${total}`;
  }

  function start(){
    ensureCtx(); stopMetro();
    L.practiceStart=performance.now();
    // reset visuals
    lane.querySelectorAll(".block").forEach(el=>{ el.classList.remove("done-good","done-ok","missed","bad-flash"); el.classList.add(Array.isArray(layout.find(x=>String(x.idx)===el.dataset.idx)?.midi)?"chord":"pending"); });
    L.cursor=0; L.mistake=false; L.good=0; L.ok=0; L.missed=0; L.running=true;
    L.bpm=song.tempo*(L.tempoBoost||1);
    view.querySelector("#l-start").classList.add("hidden");
    view.querySelector("#l-restart").classList.remove("hidden");
    view.querySelector("#l-finish").innerHTML="";
    if(L.mode==="step"){
      L.startT=performance.now();
      updateStatus(); highlightNext(); tickLoop();
    } else {
      // count-in then metronome-driven
      const countBeats=4;
      view.querySelector("#l-status").textContent="count-in…";
      metronome(L.bpm, countBeats+L.totalBeats, null, ()=>{ /* done */ });
      // THE BAND: auto-harmonized full arrangement (bass, chords, drums) —
      // Simply never makes you play over a bare metronome
      L.bars=harmonize(layout,totalBeats);
      playFullBacking(L.bars, L.bpm, countBeats);
      // playhead 0 = first note's startBeat; count-in keeps it negative until beat 0.
      // Clock = the AudioContext-scheduled metronome start (drift-free).
      L.countIn=countBeats;
      L.startT=metroStartPerf();
      tickLoop();
      updateStatus();
    }
  }
  function highlightNext(){
    clearHl();
    if(L.mode!=="step"||!L.running) return;
    const cur=L.notes[L.cursor];
    if(cur){ (Array.isArray(cur.midi)?cur.midi:[cur.midi]).forEach(m=>{hlKey(m,true); window.Hands.setHighlight(m);}); }
  }

  function playheadNow(){
    const msPerBeat=60000/L.bpm;
    return L.mode==="moving" ? (performance.now()-L.startT)/msPerBeat - (L.countIn||0)*-1 - (L.countIn||0)*2 + (L.countIn||0) : (performance.now()-L.startT)/msPerBeat;
  }

  function finish(){
    try{
      L.running=false; cancelAnimationFrame(L.raf); stopMetro(); stopMic(); stopBand(); clearHl();
      if(L.practiceStart) logPractice((performance.now()-L.practiceStart)/1000);
      const total=L.notes.length;
      const attempted=L.good+L.ok;
      const accuracy=attempted? L.good/total : 0;
      const stars=accuracy>=0.9?3:accuracy>=0.7?2:accuracy>=0.4?1:0;
      const passed=accuracy>=PASS;
      // save
      if(L.unitId){
        const p=prog[L.unitId]||{stars:0,complete:false};
        prog[L.unitId]={stars:Math.max(p.stars,stars),complete:p.complete||passed};
      }
      const sp=songProg[song.id]||{stars:0};
      songProg[song.id]={stars:Math.max(sp.stars,stars)};
      saveProg();
      view.querySelector("#l-finish").innerHTML=`<div class="finishbox">
        <div class="bigstars">${starRow(stars)}</div>
        <div class="stat">${L.good} first-try · ${L.ok} retried · ${L.missed} missed · ${(accuracy*100).toFixed(0)}%</div>
        <div class="${passed?"pass":"fail"}">${passed?"✓ Unit passed — next unlocked":(accuracy>=0.4?"So close — 80% to pass, try again!":"Keep practicing — replay as much as you like.")}</div>
        <div class="stat">${motivate(stars, passed)}</div>
        ${stars>=3 && !L.tempoBoost ? `<div class="stat" style="color:var(--brand);font-weight:800">🔥 Mastered! Try it faster:</div>
          <button class="controls" id="f-faster" style="background:linear-gradient(90deg,var(--sun,#ffd166),#ff9f43);border:none;color:#7a4a00;font-weight:800">⚡ Play at +20% tempo</button>`:""}
        <button class="controls" id="f-again">↻ Play again</button>
        <button class="controls" id="f-next">Continue</button>
      </div>`;
      const ff=view.querySelector("#f-faster");
      if(ff) ff.onclick=()=>{ L.tempoBoost=(L.tempoBoost||1)*1.2; start(); };
      view.querySelector("#f-again").onclick=start;
      view.querySelector("#f-next").onclick=()=>{ u?courseView():(opts&&opts.fromSongs?songsView():homeView()); };
    }catch(err){
      console.error("finish error:", err);
      view.querySelector("#l-finish").innerHTML=`<div class="finishbox"><div class="stat">finish error: ${err.message}</div></div>`;
    }
  }

  /* input handling: both modes route through the grader */
  function onInput(m,down){
    if(!down||!L||!L.running) return;
    const cur=L.notes[L.cursor];
    if(cur==null) return;
    const want=Array.isArray(cur.midi)?cur.midi:[cur.midi];
    // chord grading: a chord needs ALL its keys within the 1200ms window
    // (foxzi's CHORD_WINDOW_MS). Track the remaining set on L.remaining.
    if(Array.isArray(cur.midi)){
      if(!L.remaining) L.remaining=new Set(cur.midi);
      if(L.remaining.has(m)){
        L.remaining.delete(m);
        hlKey(m,false);
        if(L.remaining.size===0){ // chord complete
          L.remaining=null;
          L.cursor++;
          if(!L.mistake) L.good++; else L.ok++;
          L.mistake=false;
          updateStatus();
          // the band answers: stab on the chord that was just played
          if(L.bars){ const bi=Math.min(Math.floor((cur.startBeat||0)/4), L.bars.length-1);
            if(L.bars[bi]) bandStab(L.bars[bi], song.tempo); }
          if(L.cursor>=L.notes.length) finish(); else highlightNext();
        }
      } else { // wrong chord member
        L.mistake=true; L.remaining=null; L.remainingDeadline=0;
        const el=keyEl(m); if(el){ el.style.outline="3px solid #ff7a7a"; setTimeout(()=>el.style.outline="",160); }
      }
      return;
    }
    // melodic step
    L.remaining=null;
    // mic input: unmatched notes are IGNORED (never penalized) — tap asymmetry
    if(inputSource==="mic" && m!==cur.midi) return;
    if(L.mode==="step"){
      if(m===cur.midi){
        gradeBlock(cur, L.mistake?"done-ok":"done-good");
        if(!L.mistake) L.good++; else L.ok++;
        L.mistake=false; L.cursor++;
        L.consecMiss=0;
        updateStatus();
        // the band answers every correct note: chord stab + hat (Simply's
        // play-along feel in the patient mode where beginners live)
        if(L.bars){ const bi=Math.min(Math.floor((cur.startBeat||0)/4), L.bars.length-1);
          if(L.bars[bi]) bandStab(L.bars[bi], song.tempo); }
        if(L.cursor>=L.notes.length) finish(); else highlightNext();
      } else {
        L.mistake=true;
        const el=keyEl(m); if(el){ el.style.outline="3px solid #ff7a7a"; setTimeout(()=>el.style.outline="",160); }
      }
    } else { // moving: within ±0.4 beats of the note's start
      const msPerBeat=60000/L.bpm;
      const ph=(performance.now()-L.startT)/msPerBeat - (L.countIn||0);
      if(m===cur.midi){
        const dist=Math.abs(ph-cur.startBeat);
        if(dist<=0.4){
          gradeBlock(cur, L.mistake?"done-ok":"done-good");
          if(!L.mistake) L.good++; else L.ok++;
          L.mistake=false; L.cursor++; L.consecMiss=0; updateStatus();
          if(L.cursor>=L.notes.length) finish();
        } else { L.mistake=true; }
      } else { L.mistake=true; }
    }
  }

  /* Listen: play the song once (stop toggle) */
  view.querySelector("#l-listen").onclick=()=>{ playDemo(); };

  /* Demo (Simply's "watch me first"): full model performance with the band —
     melody through the synth, chord stabs + drums on the band bus. */
  function playDemo(){
    ensureCtx(); stopMetro();
    if(L.listenTimers.length){ L.listenTimers.forEach(clearTimeout); L.listenTimers=[];
      view.querySelector("#l-listen").textContent=window.I18N.t("lesson.listen");
      view.querySelector("#l-demo").disabled=false; return; }
    view.querySelector("#l-listen").textContent="◼ Stop";
    view.querySelector("#l-demo").disabled=true;
    const beat=60000/L.bpm; let t=0;
    layout.forEach(s=>{
      if(!s.rest){
        const midis=Array.isArray(s.midi)?s.midi:[s.midi];
        L.listenTimers.push(setTimeout(()=>{
          midis.forEach(m=>synthNote(m,s.beats,song.tempo));
          // band accompanies the demo (stab on the bar's chord)
          if(L.bars){ const bi=Math.min(Math.floor(s.startBeat/4),L.bars.length-1);
            if(s.startBeat%1===0) bandStab(L.bars[bi], song.tempo); }
        }, t*beat));
      }
      t+=s.beats;
    });
    L.listenTimers.push(setTimeout(()=>{ L.listenTimers=[];
      view.querySelector("#l-listen").textContent=window.I18N.t("lesson.listen");
      view.querySelector("#l-demo").disabled=false; }, t*beat+300));
  }
  view.querySelector("#l-demo").onclick=playDemo;

  view.querySelector("#l-start").onclick=start;
  view.querySelector("#l-restart").onclick=start;

  if(mode==="moving"){
    // moving mode: auto-start is per UX rule NOT for moving (needs ▶)
    view.querySelector("#l-status").textContent="press Start, then play in time with the metronome";
  } else {
    view.querySelector("#l-status").textContent="press Start (step mode waits for the right key)";
  }
}

/* ---------- WORKOUT ---------- */
function workoutView(){
  setView("home"); stopMetro();
  const ni=nextUnitIndex();
  const nextSong= ni>=0&&songOf(UNITS[ni].song)&&!UNITS[ni].song.startsWith("chord")&&
                  !UNITS[ni].song.startsWith("switch")&&UNITS[ni].type==="song"
                  ? songOf(UNITS[ni].song) : SONGS.filter(s=>!s.exercise&&s.difficulty===1)[0];
  const chordUnit=UNITS.find(u=>u.type==="song"&&(u.song.startsWith("chord")||u.song.startsWith("prog")));
  view.innerHTML=`<h1>⏱ Daily Workout — 5 minutes</h1>
    <p class="sub">Three segments, chained: warm-up → song → chords. Segments use the same lesson engine.</p>
    <div class="grid">
      <div class="card" id="w1"><h3>1 · Reading warm-up</h3><div class="meta">${nextSong.title} in step mode</div></div>
      <div class="card" id="w2"><h3>2 · Play a song</h3><div class="meta">${nextSong.title} — step again, focus on first-try accuracy</div></div>
      <div class="card" id="w3"><h3>3 · Chord drill</h3><div class="meta">${chordUnit?chordUnit.title:"The C Chord"}</div></div>
    </div>
    <p class="sub" style="margin-top:14px">Workout chains launch each segment in sequence — for the prototype, tap each in order.</p>`;
  document.getElementById("w1").onclick=()=>lessonView(null,{song:nextSong,mode:"step"});
  document.getElementById("w2").onclick=()=>lessonView(null,{song:nextSong,mode:"step"});
  document.getElementById("w3").onclick=()=>lessonView(chordUnit?chordUnit.id:null,{song:songOf(chordUnit?chordUnit.song:"chord-c"),mode:"step",fromSongs:true});
}

/* ================= boot ================= */
homeView();
})();
</script>
