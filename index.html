<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OpenPiano — learn piano, open source</title>
<meta name="description" content="OpenPiano: an open, offline-first piano-learning app prototype. Courses, songs, lessons, falling-notes engine, Web Audio synth, mic grading (roadmap).">
<meta name="theme-color" content="#12141a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='24' font-size='24'%3E%F0%9F%8E%B9%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg:#12141a; --panel:#1b1f2a; --panel2:#222736; --ink:#e8eaf2; --muted:#9aa3b8;
    --accent:#7aa2ff; --accent2:#66d9c4; --soloist:#6fb3ff; --chords:#ff9ec4;
    --good:#7ad97a; --ok:#ffd166; --bad:#ff7a7a; --radius:12px; --max:1080px;
  }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--ink);
    font:15px/1.55 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  a { color:var(--accent); text-decoration:none; }
  button { font:inherit; }
  /* ---------- app shell ---------- */
  header.app {
    position:sticky; top:0; z-index:10; background:rgba(18,20,26,.92); backdrop-filter:blur(8px);
    border-bottom:1px solid #2e3548; padding:10px 16px;
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  }
  header.app .logo { font-weight:700; font-size:1.05rem; }
  header.app nav { display:flex; gap:4px; flex-wrap:wrap; }
  header.app nav button {
    background:none; border:1px solid transparent; color:var(--muted);
    border-radius:8px; padding:6px 12px; cursor:pointer;
  }
  header.app nav button.active { color:var(--ink); border-color:#2e3548; background:var(--panel); }
  main { max-width:var(--max); margin:0 auto; padding:20px 16px 90px; }
  h1 { font-size:1.5rem; margin:8px 0 2px; letter-spacing:-0.01em; }
  .sub { color:var(--muted); margin-bottom:18px; font-size:.95rem; }
  /* ---------- cards & grids ---------- */
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:12px; }
  .card {
    background:var(--panel); border:1px solid #2e3548; border-radius:var(--radius);
    padding:14px; cursor:pointer; transition:border-color .15s;
  }
  .card:hover { border-color:var(--accent); }
  .card h3 { font-size:.98rem; margin-bottom:3px; }
  .card .meta { color:var(--muted); font-size:.8rem; }
  .card.locked { opacity:.55; cursor:default; }
  .card.locked:hover { border-color:#2e3548; }
  .card .stars { color:#ffd166; letter-spacing:2px; font-size:.85rem; min-height:1em; display:block; }
  .tier { font-size:.68rem; border-radius:5px; padding:2px 7px; display:inline-block; margin-bottom:6px; }
  .tier.beginner{background:#14351f;color:#8fe3a4} .tier.intermediate{background:#332a14;color:#ffd97a}
  .tier.chords-basics{background:#341b28;color:#ffa9c8} .tier.chords-prog{background:#2c1a3a;color:#c9a2ff}
  .pathbadge { font-size:.68rem; border-radius:5px; padding:2px 7px; display:inline-block; margin-left:6px; }
  .pathbadge.soloist{background:#14304f;color:#8fc3ff} .pathbadge.chords{background:#431b2c;color:#ffa9c8}
  /* ---------- lesson view ---------- */
  .back { background:none; border:1px solid #2e3548; color:var(--muted); border-radius:8px;
          padding:6px 12px; cursor:pointer; margin-bottom:12px; }
  .back:hover { color:var(--ink); border-color:var(--accent); }
  .lessonhead { display:flex; gap:14px; align-items:baseline; flex-wrap:wrap; margin-bottom:12px; }
  .lessonhead h1 { margin:0; }
  /* ---------- falling lane ---------- */
  .lane {
    position:relative; height:300px; background:var(--panel);
    border:1px solid #2e3548; border-radius:var(--radius); overflow:hidden; margin-bottom:8px;
  }
  .lane .hitline { position:absolute; left:0; right:0; bottom:0; height:2px;
    background:linear-gradient(90deg,transparent,var(--accent2),transparent); }
  .block { position:absolute; border-radius:6px; display:flex; align-items:flex-end; justify-content:center;
    font-size:.75rem; color:#10121a; font-weight:600; padding-bottom:2px; }
  .block.chord { background:linear-gradient(#ffd977,#e8b53f); }
  .block.pending { background:linear-gradient(#cfe0ff,#9dbdf5); }
  .block.done-good { background:linear-gradient(#b7eeb7,#69c469); }
  .block.done-ok { background:linear-gradient(#ffe4a3,#e5b84f); }
  .block.missed { background:#4a4f5e; color:#9aa3b8; }
  .block.bad-flash { background:var(--bad) !important; }
  /* ---------- piano ---------- */
  .kb { position:relative; height:170px; user-select:none; touch-action:none;
        display:flex; border-radius:8px; overflow:hidden; }
  .wk { flex:1; background:linear-gradient(#fff,#e8e8ee); border:1px solid #b9b9c4;
        border-radius:0 0 6px 6px; position:relative; cursor:pointer; }
  .wk .lbl,.bk .lbl { position:absolute; bottom:8px; left:0; right:0; text-align:center;
        color:#666; font-size:.7rem; pointer-events:none; }
  .bk .lbl { bottom:6px; color:#9a9aa6; font-size:.6rem; }
  .bk { position:absolute; top:0; height:62%; z-index:2;
        background:linear-gradient(#33343d,#101116); border:1px solid #000;
        border-radius:0 0 5px 5px; cursor:pointer; }
  .wk.down { background:linear-gradient(#d7e5ff,#b9d2ff); }
  .bk.down { background:linear-gradient(#3a5a9a,#23375e); }
  .wk.hl,.bk.hl { box-shadow:inset 0 0 0 2.5px var(--accent); }
  .wk.hl { background:linear-gradient(#cfe2ff,#a9c6ff); }
  .bk.hl { background:linear-gradient(#3d5f9e,#27406e); }
  /* ---------- lesson controls ---------- */
  .controls { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin:10px 0; }
  .controls button, .controls select {
    background:var(--panel2); color:var(--ink); border:1px solid #2e3548;
    border-radius:8px; padding:8px 14px; cursor:pointer; font-size:.9rem;
  }
  .controls button:hover { border-color:var(--accent); }
  .controls button.primary { border-color:var(--accent2); color:var(--accent2); }
  .progressbar { flex:1; min-width:160px; height:8px; background:var(--panel2);
    border-radius:99px; overflow:hidden; }
  .progressbar i { display:block; height:100%; width:0; background:var(--accent2); transition:width .2s; }
  .finishbox {
    background:var(--panel); border:1px solid #2e3548; border-radius:var(--radius);
    padding:22px; text-align:center; margin-top:14px;
  }
  .finishbox .bigstars { font-size:2.2rem; letter-spacing:6px; color:#ffd166; }
  .finishbox .stat { color:var(--muted); margin-top:4px; }
  .finishbox .pass { color:var(--good); font-weight:600; margin-top:6px; }
  .finishbox .fail { color:var(--warn,#ffcc66); font-weight:600; margin-top:6px; }
  .finishbox button { margin-top:14px; }
  .hidden { display:none !important; }
  .lessonmeta { color:var(--muted); font-size:.85rem; }
  footer { text-align:center; color:var(--muted); font-size:.8rem; padding:30px 0 50px; }
</style>
</head>
<body>

<header class="app">
  <span class="logo">🎹 OpenPiano</span>
  <nav>
    <button data-view="home" class="active">Home</button>
    <button data-view="course">Course</button>
    <button data-view="songs">Songs</button>
    <button data-view="free">Free Play</button>
  </nav>
</header>

<main id="view"></main>

<footer>OpenPiano prototype · course engine + falling notes + good/ok grading + 80% pass gate ·
  <a href="https://github.com/itpick/openpiano">github.com/itpick/openpiano</a></footer>

<script src="app/data.js"></script>
<script src="app/render.js"></script>
<script src="app/mic.js"></script>
<script>
(() => {
"use strict";
const DATA = window.OPENPIANO_DATA;
const SONGS = DATA.songs, UNITS = DATA.units;
const NAMES = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
const view = document.getElementById("view");

/* ================= state (localStorage, single player) ================= */
const store = {
  get(k,d){ try{ const v=localStorage.getItem("openpiano."+k); return v==null?d:JSON.parse(v);}catch(e){return d;} },
  set(k,v){ localStorage.setItem("openpiano."+k, JSON.stringify(v)); }
};
const prog = store.get("course", {}); // {unitId: {stars, complete}}
const songProg = store.get("songs", {}); // {songId: {stars, bestAccuracy}}
const saveProg = () => { store.set("course", prog); store.set("songs", songProg); };

/* ================= course helpers (course.js semantics) ================= */
const PASS = 0.8;
const tierName = {beginner:"Beginner", intermediate:"Intermediate", "chords-basics":"Chord Basics", "chords-prog":"Progressions"};
const unitComplete = id => !!(prog[id] && prog[id].complete);
const unitUnlocked = i => i<=0 || unitComplete(UNITS[i-1].id);
const nextUnitIndex = () => { for(let i=0;i<UNITS.length;i++) if(unitUnlocked(i)&&!unitComplete(UNITS[i].id)) return i; return -1; };
const songOf = id => SONGS.find(s=>s.id===id);
const starRow = n => "★★★".slice(0,n)+"☆☆☆".slice(0,3-n);

/* ================= audio (two detuned oscillators + ADSR) ================= */
let actx=null, master=null; const voices=new Map();
function ensureAudioCtx(){
  if(!actx){ actx=new (window.AudioContext||window.webkitAudioContext)();
    master=actx.createGain(); master.gain.value=0.32; master.connect(actx.destination); }
  if(actx.state==="suspended") actx.resume();
  return actx;
}
window.__op={ get ctx(){ return actx; }, ensureCtx: ensureAudioCtx };
/* e2e probe: sound a note through the app's own synth so the mic can prove
   echo suppression (the app must NOT grade its own speaker output). */
window.__opEchoProbe=function(){ synthNote(69,0.8,90); };
function ensureCtx(){
  if(!actx){ actx=new (window.AudioContext||window.webkitAudioContext)();
    master=actx.createGain(); master.gain.value=0.32; master.connect(actx.destination); }
  if(actx.state==="suspended") actx.resume();
}
function midiFreq(m){ return 440*Math.pow(2,(m-69)/12); }
function synthNote(midi, durBeats=1, bpm=90){
  ensureCtx();
  const t=actx.currentTime, f=midiFreq(midi), secs=Math.max(0.25, durBeats*60/bpm);
  // echo-suppression stamp: the mic must ignore our own speaker. Stamp at onset
  // and again at the audible decay end (~0.6s) — NOT at note-end, or fast
  // same-pitch repeats get swallowed by the echo window.
  if(window.Mic) window.Mic.stampEcho(midi);
  setTimeout(()=>{ if(window.Mic) window.Mic.stampEcho(midi); }, Math.min(secs*600, 900));
  const o1=actx.createOscillator(), o2=actx.createOscillator(), g=actx.createGain();
  o1.type="triangle"; o2.type="triangle";
  o1.frequency.value=f; o2.frequency.value=f*1.003;
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(0.5,t+0.012);
  g.gain.setValueAtTime(0.4,t+secs*0.6);
  g.gain.exponentialRampToValueAtTime(0.0001,t+secs+0.35);
  o1.connect(g); o2.connect(g); g.connect(master);
  o1.start(t); o2.start(t);
  o1.stop(t+secs+0.4); o2.stop(t+secs+0.4);
}
let metroTimer=null, metroStartT=0;
function metronome(bpm, beats, onTick, onDone){
  ensureCtx();
  const msPerBeat=60000/bpm;
  // schedule every click on the AudioContext clock (sample-accurate, no
  // setInterval drift) — the visual tick callback is the fallback timer
  metroStartT=actx.currentTime;
  for(let b=0;b<beats;b++){
    const t=metroStartT+b*msPerBeat/1000;
    const o=actx.createOscillator(), g=actx.createGain();
    o.type="square"; o.frequency.value= b%4===0?1568:1046;
    g.gain.setValueAtTime(0.08,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.05);
    o.connect(g); g.connect(master); o.start(t); o.stop(t+0.06);
  }
  let beat=0;
  const tick=()=>{
    if(onTick) onTick(beat);
    beat++;
    if(beat>=beats){ stopMetro(); if(onDone) onDone(); }
  };
  tick();
  metroTimer=setInterval(tick, msPerBeat);
}
function stopMetro(){ if(metroTimer){ clearInterval(metroTimer); metroTimer=null; } }
function metroStartPerf(){ // performance.now() aligned to the metronome's beat 0
  return metroStartT ? performance.now() - (actx.currentTime - metroStartT)*1000 : performance.now();
}

/* ================= keyboard ================= */
const WHITE=m=>![1,3,6,8,10].includes(((m%12)+12)%12);
let kbShift=0;
const keyEls={};
function buildKB(kbEl, lo, hi){
  kbEl.innerHTML=""; for(const k in keyEls) delete keyEls[k];
  const whites=[], blacks=[];
  for(let m=lo;m<=hi;m++) (WHITE(m)?whites:blacks).push(m);
  whites.forEach(m=>{
    const el=document.createElement("div"); el.className="wk"; el.dataset.midi=m;
    el.innerHTML=`<span class="lbl">${NAMES[m%12]}</span>`;
    kbEl.append(el); keyEls[m]=el;
  });
  const wW=100/whites.length;
  blacks.forEach(m=>{
    const left=whites.filter(w=>w<m).length;
    const el=document.createElement("div"); el.className="bk"; el.dataset.midi=m;
    // real-piano ratio: black ≈ 58% of a white key's width, centered on the
    // boundary between its two neighbors
    const bw=wW*0.58;
    el.style.width=bw+"%";
    el.style.left=(left*wW - bw/2)+"%";
    el.innerHTML=`<span class="lbl">${NAMES[m%12]}</span>`;
    kbEl.append(el); keyEls[m]=el;
  });
}
function keyEl(m){ return keyEls[m]; }
function hlKey(m,on){ const el=keyEls[m]; if(el) el.classList.toggle("hl",!!on); }
function clearHl(){ document.querySelectorAll(".hl").forEach(el=>el.classList.remove("hl")); }

/* pointer + computer keyboard input */
function wireKB(kbEl, onInput){
  let down=false; const active=new Map();
  const midiAt=e=>{ const el=document.elementFromPoint(e.clientX,e.clientY);
    return el&&el.dataset&&el.dataset.midi?+el.dataset.midi:null; };
  kbEl.addEventListener("pointerdown",e=>{ down=true; try{ kbEl.setPointerCapture(e.pointerId);}catch(err){}
    const m=midiAt(e); if(m!=null){ active.set(e.pointerId,m); press(m);} });
  kbEl.addEventListener("pointermove",e=>{ if(!down) return;
    const prev=active.get(e.pointerId), m=midiAt(e);
    if(m!==prev){ if(prev!=null) release(prev);
      if(m!=null){ active.set(e.pointerId,m); press(m);} else active.delete(e.pointerId); } });
  const up=e=>{ const prev=active.get(e.pointerId); if(prev!=null) release(prev);
    active.delete(e.pointerId); if(!active.size) down=false; };
  kbEl.addEventListener("pointerup",up); kbEl.addEventListener("pointercancel",up);

  const KEYMAP={a:0,w:1,s:2,e:3,d:4,f:5,t:6,g:7,y:8,h:9,u:10,j:11,k:12,o:13,l:14,p:15,";":16};  const held=new Set();
  const kd=e=>{ if(e.repeat||e.target.tagName==="SELECT"||e.target.tagName==="INPUT") return;
    const off=KEYMAP[e.key.toLowerCase()]; if(off==null) return;
    const m=kbLo()+off; if(held.has(m)) return; held.add(m); press(m); };
  const ku=e=>{ const off=KEYMAP[e.key.toLowerCase()]; if(off==null) return;
    const m=kbLo()+off; if(held.has(m)){ held.delete(m); release(m);} };
  let kbLoFn=()=>60;
  function kbLo(){ return kbLoFn(); }
  window.addEventListener("keydown",kd); window.addEventListener("keyup",ku);
  function press(m){ visual(m,true); onInput&&onInput(m,true); }
  function release(m){ visual(m,false); onInput&&onInput(m,false); }
  function visual(m,downv){ synthNotePress(m,downv); }
  return { setLo:(fn)=>{ kbLoFn=fn; }, cleanup(){ window.removeEventListener("keydown",kd); window.removeEventListener("keyup",ku); } };
}

/* live synth tied to key visuals (sustains while held) */
const liveVoices=new Map();
function synthNotePress(m,down){
  ensureCtx();
  if(down){
    if(liveVoices.has(m)) return;
    const t=actx.currentTime, f=midiFreq(m);
    const o1=actx.createOscillator(), o2=actx.createOscillator(), g=actx.createGain();
    o1.type="triangle"; o2.type="triangle";
    o1.frequency.value=f; o2.frequency.value=f*1.003;
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.45,t+0.012);
    o1.connect(g); o2.connect(g); g.connect(master);
    o1.start(t); o2.start(t);
    liveVoices.set(m,{o1,o2,g});
    const el=keyEl(m); if(el) el.classList.add("down");
  } else {
    const v=liveVoices.get(m); if(!v) return;
    const t=actx.currentTime;
    v.g.gain.cancelScheduledValues(t); v.g.gain.setTargetAtTime(0.0001,t,0.09);
    setTimeout(()=>{ try{v.o1.stop();v.o2.stop();}catch(e){} },450);
    liveVoices.delete(m);
    const el=keyEl(m); if(el) el.classList.remove("down");
  }
}

/* ================= views ================= */
const VIEWS={ home:homeView, course:courseView, songs:songsView, free:freeView };
function setView(name){ document.querySelectorAll("header.app nav button").forEach(b=>
  b.classList.toggle("active", b.dataset.view===name)); }
document.querySelectorAll("header.app nav button").forEach(b=>
  b.addEventListener("click",()=>{ stopMetro(); VIEWS[b.dataset.view](); }));

let kbApi=null;
function mountKB(lo,hi,onInput){
  if(kbApi&&kbApi.cleanup){ kbApi.cleanup(); }
  const kbEl=document.createElement("div"); kbEl.className="kb";
  view.append(kbEl);
  buildKB(kbEl,lo,hi);
  kbApi=wireKB(kbEl,onInput);
  kbApi.setLo(()=>lo);
}

/* ---------- HOME ---------- */
function homeView(){
  setView("home"); stopMetro(); clearHl();
  const ni=nextUnitIndex();
  const done=UNITS.filter(u=>unitComplete(u.id)).length;
  view.innerHTML=`<h1>Welcome back</h1>
    <p class="sub">${done} / ${UNITS.length} units complete · progress saved in your browser</p>
    <div class="grid">
      <div class="card" id="home-continue">
        <span class="tier ${UNITS[Math.max(ni,0)].tier}">${tierName[UNITS[Math.max(ni,0)].tier]}</span>
        <h3>${ni<0?"All units complete":"Continue: "+UNITS[ni].title}</h3>
        <div class="meta">${ni<0?"Replay any lesson from the Course tab":UNITS[ni].blurb}</div>
        <span class="stars"></span>
      </div>
      <div class="card" id="home-workout">
        <h3>⏱ Daily Workout</h3>
        <div class="meta">5-minute session: reading warm-up → next song → chord drill</div>
        <span class="stars"></span>
      </div>
      <div class="card" id="home-songs">
        <h3>🎵 Song library</h3>
        <div class="meta">${SONGS.filter(s=>!s.exercise).length} songs · ${Object.keys(songProg).length} played</div>
        <span class="stars"></span>
      </div>
      <div class="card" id="home-free">
        <h3>🎹 Free Play</h3>
        <div class="meta">Explore the keyboard, 2 octaves</div>
        <span class="stars"></span>
      </div>
    </div>`;
  document.getElementById("home-continue").onclick=()=>{ if(ni>=0) lessonView(UNITS[ni].id); };
  document.getElementById("home-workout").onclick=workoutView;
  document.getElementById("home-songs").onclick=songsView;
  document.getElementById("home-free").onclick=freeView;
}

/* ---------- COURSE ---------- */
function courseView(){
  setView("course"); stopMetro(); clearHl();
  const groups={};
  UNITS.forEach((u,i)=>{ (groups[u.tier]=groups[u.tier]||[]).push({u,i}); });
  view.innerHTML=`<h1>Course</h1>
    <p class="sub">Units unlock in order · <b>80% accuracy to pass</b> · stars 3★≥90 2★≥70 1★≥40</p>
    <div id="course-list"></div>`;
  const list=document.getElementById("course-list");
  Object.keys(groups).forEach(tier=>{
    const h=document.createElement("h2"); h.style.cssText="font-size:1.1rem;margin:22px 0 10px";
    h.innerHTML=`<span class="tier ${tier}">${tierName[tier]}</span>`;
    list.append(h);
    const grid=document.createElement("div"); grid.className="grid";
    groups[tier].forEach(({u,i})=>{
      const p=prog[u.id]||{}; const unlocked=unitUnlocked(i);
      const s=songOf(u.song); const meta = u.type==="song"&&s ? `${s.tempo} BPM · diff ${s.difficulty}` :
        u.type==="trainer"?"staff reading drill": "find the keys";
      const card=document.createElement("div");
      card.className="card"+(unlocked?"":" locked");
      card.innerHTML=`<span class="tier ${u.tier}">${tierName[u.tier]}</span>
        ${u.mode==="moving"?'<span class="pathbadge soloist">in time</span>':""}
        <h3>${unlocked?u.title:"🔒 "+u.title}</h3>
        <div class="meta">${u.type} · ${meta}</div>
        <span class="stars">${p.stars?starRow(p.stars):""}</span>`;
      if(unlocked) card.onclick=()=>lessonView(u.id);
      grid.append(card);
    });
    list.append(grid);
  });
}

/* ---------- SONGS ---------- */
function songsView(){
  setView("songs"); stopMetro(); clearHl();
  const lib=SONGS.filter(s=>!s.exercise);
  const genres=["all",...new Set(lib.map(s=>s.genre))];
  view.innerHTML=`<h1>Songs</h1>
    <p class="sub">${lib.length} songs — play-along in step mode; "in time" (moving) unlocks after 2★</p>
    <div class="controls" id="genrebar"></div><div class="grid" id="songgrid"></div>`;
  const bar=document.getElementById("genrebar"), grid=document.getElementById("songgrid");
  let curGenre="all";
  function render(){
    grid.innerHTML="";
    lib.filter(s=>curGenre==="all"||s.genre===curGenre)
       .sort((a,b)=>a.difficulty-b.difficulty||a.title.localeCompare(b.title))
       .forEach(s=>{
      const p=songProg[s.id]||{};
      const movingOk=(p.stars||0)>=2;
      const card=document.createElement("div"); card.className="card";
      card.innerHTML=`<h3>${s.title}</h3>
        <div class="meta">diff ${s.difficulty} · ${s.tempo} BPM · ${s.genre}</div>
        <div class="controls" style="margin:8px 0 0">
          <button data-mode="step">▶ Step</button>
          <button data-mode="moving" ${movingOk?"":"disabled title='earn 2★ in step mode'"}>⏩ In time</button>
        </div>
        <span class="stars">${p.stars?starRow(p.stars):""}</span>`;
      card.querySelectorAll("button").forEach(b=>b.onclick=e=>{
        e.stopPropagation(); lessonView(null,{song:s,mode:b.dataset.mode,fromSongs:true});
      });
      grid.append(card);
    });
  }
  genres.forEach(g=>{
    const b=document.createElement("button"); b.textContent=g; b.className=g===curGenre?"primary":"";
    b.onclick=()=>{ curGenre=g; bar.querySelectorAll("button").forEach(x=>x.classList.remove("primary")); b.classList.add("primary"); render(); };
    bar.append(b);
  });
  render();
}

/* ---------- FREE PLAY ---------- */
function freeView(){
  setView("free"); stopMetro(); clearHl();
  view.innerHTML=`<h1>Free Play</h1>
    <p class="sub">Two octaves · pointer with glissando · computer keys A W S E D F T G Y H U J K …</p>`;
  mountKB(48,72,null);
}

/* ---------- LESSON (the engine) ---------- */
let L=null; // live lesson state
function lessonView(unitId, opts){
  setView(unitId?"course":(opts&&opts.fromSongs?"songs":"home"));
  stopMetro(); clearHl();
  const u=unitId?UNITS.find(x=>x.id===unitId):null;
  // keyfind/trainer units have no library song — synthesize a drill song from
  // the unit data (mirrors simpli-piano's trainer/keyfind lesson plumbing)
  let song;
  if (opts&&opts.song) song=opts.song;
  else if (u&&u.song) song=songOf(u.song);
  else if (u&&u.type==="keyfind"){
    // random-order key finding: u.notes shuffled, goal repetitions
    const notes=(u.notes||[60,62,64]).slice();
    const seq=[]; for(let i=0;i<(u.goal||6);i++) seq.push(notes[Math.floor(Math.random()*notes.length)]);
    song={id:"drill-"+u.id,title:u.title,difficulty:1,tempo:88,genre:"exercise",
          steps:seq.map(m=>({midi:m,beats:1})),lo:Math.min(...seq),hi:Math.max(...seq)};
  } else if (u&&u.type==="trainer"){
    // staff-reading drill: fixedNotes in random order (staff rendering TODO)
    const notes=(u.fixedNotes||[60,62,64]).slice();
    const seq=[]; for(let i=0;i<(u.goal||8);i++) seq.push(notes[Math.floor(Math.random()*notes.length)]);
    song={id:"drill-"+u.id,title:u.title,difficulty:1,tempo:84,genre:"exercise",
          steps:seq.map(m=>({midi:m,beats:1})),lo:Math.min(...seq),hi:Math.max(...seq),clef:u.clef};
  } else song=SONGS[0];
  const mode=opts&&opts.mode?opts.mode:(u&&u.mode==="moving"?"moving":"step");  const backLabel=u?"← Course":(opts&&opts.fromSongs?"← Songs":"← Home");

  view.innerHTML=`<button class="back">${backLabel}</button>
    <div class="lessonhead">
      <h1>${u?u.title:song.title}</h1>
      <span class="lessonmeta">${song.tempo} BPM · ${mode==="moving"?"moving — play in time":"step — waits for you"}
        ${u?` · ${tierName[u.tier]}`:""}</span>
    </div>
    <div class="lane" id="lane"><div class="hitline"></div></div>
    <div class="controls">
      <button id="l-start" class="primary">▶ Start</button>
      <button id="l-restart" class="hidden">↻ Restart</button>
      <button id="l-listen">🔊 Listen</button>
      <button id="l-mic" title="Play your real piano — the app listens and grades">🎤 Mic</button>
      <div class="progressbar"><i id="l-prog"></i></div>
      <span class="lessonmeta" id="l-status"></span>
    </div>
    <div id="l-finish"></div>`;
  view.querySelector(".back").onclick=()=>{ stopMic(); stopMetro(); u?courseView():(opts&&opts.fromSongs?songsView():homeView()); };

  // ---- build the falling lane ----
  const lane=view.querySelector("#lane");
  const PPB=44, HIT=10;
  let beat=0;
  const layout=song.steps.map(st=>{ const s={...st,startBeat:beat}; beat+=st.beats; return s; });
  const totalBeats=beat;
  const kbTop=()=>lane.clientHeight; // px of hit line
  const notes=layout.filter(s=>!s.rest);
  notes.forEach((s,i)=>s.idx=i);
  L={ unitId, song, mode, layout, totalBeats, notes, cursor:0, mistake:false,
      good:0, ok:0, missed:0, running:false, startT:0, playhead:0, raf:null, listenTimers:[] };
  mountKB(48,84,onInput);

  // mic input: always share the app's AudioContext so the virtual-mic stream and
  // the analyser live on the same clock (real devices: same context = same latency)
  window.Mic.useContext(ensureAudioCtx());
  let inputSource="tap";
  const micBtn=view.querySelector("#l-mic");
  // chords are tap-only: the mic is monophonic (ACF2+); chord detection is the
  // commercial app's MusicSense moat (see research/simpli-piano-coniker)
  const hasChords=layout.some(s=>!s.rest&&Array.isArray(s.midi));
  if(hasChords){ micBtn.disabled=true; micBtn.title="Chords are graded by tapping — the mic grades single notes only"; }
  micBtn.onclick=async()=>{
    ensureCtx();
    if(inputSource==="mic"){ stopMic(); inputSource="tap"; micBtn.classList.remove("primary"); return; }
    micBtn.textContent="🎤 starting…";
    try{
      await window.Mic.start(m=>{
        synthNotePress(m,true); setTimeout(()=>synthNotePress(m,false),150);
        onInput(m,true);
      });
      inputSource="mic"; micBtn.classList.add("primary"); micBtn.textContent="🎤 listening (tap to stop)";
      view.querySelector("#l-status").textContent="mic on — play on your real piano";
    }catch(err){
      micBtn.textContent="🎤 mic unavailable";
      view.querySelector("#l-status").textContent="mic error: "+err.message;
      setTimeout(()=>{ micBtn.textContent="🎤 Mic"; },3000);
    }
  };
  function stopMic(){ if(window.Mic&&window.Mic.info().running){ window.Mic.stop();
    if(micBtn){ micBtn.classList.remove("primary"); micBtn.textContent="🎤 Mic"; } inputSource="tap"; } }
  if(L) L.stopMic=stopMic;

  function drawBlocks(){
    lane.querySelectorAll(".block").forEach(el=>el.remove());
    layout.forEach(s=>{
      if(s.rest) return;
      const el=document.createElement("div");
      el.className="block "+(Array.isArray(s.midi)?"chord":"pending");
      el.dataset.idx=s.idx;
      const h=Math.max(18,s.beats*PPB-4);
      el.style.height=h+"px";
      el.style.width=lane.clientWidth*0.16+"px";
      el.style.left=(6+ (s.idx%4)*0.2*lane.clientWidth )+"px";
      el.style.bottom=(HIT + s.startBeat*PPB)+"px";
      el.textContent=Array.isArray(s.midi)?s.midi.map(m=>NAMES[m%12]).join("+"):NAMES[s.midi%12];
      lane.append(el);
    });
  }
  drawBlocks();
  window.addEventListener("resize",drawBlocks);

  function tickLoop(){
    if(!L.running) return;
    const msPerBeat=60000/song.tempo;
    const now=performance.now();
    // playhead relative to beat 0 (count-in makes it negative)
    L.playhead=(now-L.startT)/msPerBeat - (L.countIn||0);
    // move blocks
    lane.querySelectorAll(".block").forEach(el=>{
      const s=layout.find(x=>String(x.idx)===el.dataset.idx);
      if(!s) return;
      el.style.bottom=(HIT + (s.startBeat-L.playhead)*PPB)+"px";
    });
    // miss detection (moving mode)
    if(L.mode==="moving"){
      const cur=L.notes[L.cursor];
      if(cur && L.playhead>cur.startBeat+cur.beats+0.4){
        markMissed(cur); L.cursor++; L.missed++;
        updateStatus();
        if(L.cursor>=L.notes.length) finish();
      }
    }
    L.raf=requestAnimationFrame(tickLoop);
  }

  function markMissed(s){ const el=lane.querySelector(`.block[data-idx="${s.idx}"]`);
    if(el) el.classList.replace(el.className.match(/pending|chord/)[0],"missed"); }
  function gradeBlock(s,cls){ const el=lane.querySelector(`.block[data-idx="${s.idx}"]`);
    if(el){ el.classList.remove("pending","chord"); el.classList.add(cls); } }

  function updateStatus(){
    const done=L.cursor, total=L.notes.length;
    view.querySelector("#l-prog").style.width=(done/total*100)+"%";
    view.querySelector("#l-status").textContent=`${done} / ${total}`;
  }

  function start(){
    ensureCtx(); stopMetro();
    // reset visuals
    lane.querySelectorAll(".block").forEach(el=>{ el.classList.remove("done-good","done-ok","missed","bad-flash"); el.classList.add(Array.isArray(layout.find(x=>String(x.idx)===el.dataset.idx)?.midi)?"chord":"pending"); });
    L.cursor=0; L.mistake=false; L.good=0; L.ok=0; L.missed=0; L.running=true;
    view.querySelector("#l-start").classList.add("hidden");
    view.querySelector("#l-restart").classList.remove("hidden");
    view.querySelector("#l-finish").innerHTML="";
    if(L.mode==="step"){
      L.startT=performance.now();
      updateStatus(); highlightNext(); tickLoop();
    } else {
      // count-in then metronome-driven
      const countBeats=4;
      view.querySelector("#l-status").textContent="count-in…";
      metronome(song.tempo, countBeats+L.totalBeats, null, ()=>{ /* done */ });
      // playhead 0 = first note's startBeat; count-in keeps it negative until beat 0.
      // Clock = the AudioContext-scheduled metronome start (drift-free).
      L.countIn=countBeats;
      L.startT=metroStartPerf();
      tickLoop();
      updateStatus();
    }
  }
  function highlightNext(){
    clearHl();
    if(L.mode!=="step"||!L.running) return;
    const cur=L.notes[L.cursor];
    if(cur){ (Array.isArray(cur.midi)?cur.midi:[cur.midi]).forEach(m=>hlKey(m,true)); }
  }

  function playheadNow(){
    const msPerBeat=60000/song.tempo;
    return L.mode==="moving" ? (performance.now()-L.startT)/msPerBeat - (L.countIn||0)*-1 - (L.countIn||0)*2 + (L.countIn||0) : (performance.now()-L.startT)/msPerBeat;
  }

  function finish(){
    try{
      L.running=false; cancelAnimationFrame(L.raf); stopMetro(); stopMic(); clearHl();
      const total=L.notes.length;
      const attempted=L.good+L.ok;
      const accuracy=attempted? L.good/total : 0;
      const stars=accuracy>=0.9?3:accuracy>=0.7?2:accuracy>=0.4?1:0;
      const passed=accuracy>=PASS;
      // save
      if(L.unitId){
        const p=prog[L.unitId]||{stars:0,complete:false};
        prog[L.unitId]={stars:Math.max(p.stars,stars),complete:p.complete||passed};
      }
      const sp=songProg[song.id]||{stars:0};
      songProg[song.id]={stars:Math.max(sp.stars,stars)};
      saveProg();
      view.querySelector("#l-finish").innerHTML=`<div class="finishbox">
        <div class="bigstars">${starRow(stars)}</div>
        <div class="stat">${L.good} first-try · ${L.ok} retried · ${L.missed} missed · ${(accuracy*100).toFixed(0)}%</div>
        <div class="${passed?"pass":"fail"}">${passed?"✓ Unit passed — next unlocked":(accuracy>=0.4?"So close — 80% to pass, try again!":"Keep practicing — replay as much as you like.")}</div>
        <button class="controls" id="f-again">↻ Play again</button>
        <button class="controls" id="f-next">Continue</button>
      </div>`;
      view.querySelector("#f-again").onclick=start;
      view.querySelector("#f-next").onclick=()=>{ u?courseView():(opts&&opts.fromSongs?songsView():homeView()); };
    }catch(err){
      console.error("finish error:", err);
      view.querySelector("#l-finish").innerHTML=`<div class="finishbox"><div class="stat">finish error: ${err.message}</div></div>`;
    }
  }

  /* input handling: both modes route through the grader */
  function onInput(m,down){
    if(!down||!L||!L.running) return;
    const cur=L.notes[L.cursor];
    if(cur==null) return;
    const want=Array.isArray(cur.midi)?cur.midi:[cur.midi];
    // chord grading: a chord needs ALL its keys within the 1200ms window
    // (foxzi's CHORD_WINDOW_MS). Track the remaining set on L.remaining.
    if(Array.isArray(cur.midi)){
      if(!L.remaining) L.remaining=new Set(cur.midi);
      if(L.remaining.has(m)){
        L.remaining.delete(m);
        hlKey(m,false);
        if(L.remaining.size===0){ // chord complete
          L.remaining=null;
          L.cursor++;
          if(!L.mistake) L.good++; else L.ok++;
          L.mistake=false;
          updateStatus();
          if(L.cursor>=L.notes.length) finish(); else highlightNext();
        }
      } else { // wrong chord member
        L.mistake=true; L.remaining=null; L.remainingDeadline=0;
        const el=keyEl(m); if(el){ el.style.outline="2px solid var(--bad)"; setTimeout(()=>el.style.outline="",160); }
      }
      return;
    }
    // melodic step
    L.remaining=null;
    // mic input: unmatched notes are IGNORED (never penalized) — tap asymmetry
    if(inputSource==="mic" && m!==cur.midi) return;
    if(L.mode==="step"){
      if(m===cur.midi){
        gradeBlock(cur, L.mistake?"done-ok":"done-good");
        if(!L.mistake) L.good++; else L.ok++;
        L.mistake=false; L.cursor++;
        updateStatus();
        if(L.cursor>=L.notes.length) finish(); else highlightNext();
      } else {
        L.mistake=true;
        const el=keyEl(m); if(el){ el.style.outline="2px solid var(--bad)"; setTimeout(()=>el.style.outline="",160); }
      }
    } else { // moving: within ±0.4 beats of the note's start
      const msPerBeat=60000/song.tempo;
      const ph=(performance.now()-L.startT)/msPerBeat - (L.countIn||0);
      if(m===cur.midi){
        const dist=Math.abs(ph-cur.startBeat);
        if(dist<=0.4){
          gradeBlock(cur, L.mistake?"done-ok":"done-good");
          if(!L.mistake) L.good++; else L.ok++;
          L.mistake=false; L.cursor++; updateStatus();
          if(L.cursor>=L.notes.length) finish();
        } else { L.mistake=true; }
      } else { L.mistake=true; }
    }
  }

  /* Listen: play the song once (stop toggle) */
  view.querySelector("#l-listen").onclick=()=>{
    ensureCtx(); stopMetro();
    if(L.listenTimers.length){ L.listenTimers.forEach(clearTimeout); L.listenTimers=[];
      view.querySelector("#l-listen").textContent="🔊 Listen"; return; }
    view.querySelector("#l-listen").textContent="◼ Stop";
    const beat=60000/song.tempo; let t=0;
    layout.forEach(s=>{
      if(!s.rest){
        const midis=Array.isArray(s.midi)?s.midi:[s.midi];
        L.listenTimers.push(setTimeout(()=>midis.forEach(m=>synthNote(m,s.beats,song.tempo)), t*beat));
      }
      t+=s.beats;
    });
    L.listenTimers.push(setTimeout(()=>{ L.listenTimers=[];
      view.querySelector("#l-listen").textContent="🔊 Listen"; }, t*beat+300));
  };

  view.querySelector("#l-start").onclick=start;
  view.querySelector("#l-restart").onclick=start;

  if(mode==="moving"){
    // moving mode: auto-start is per UX rule NOT for moving (needs ▶)
    view.querySelector("#l-status").textContent="press Start, then play in time with the metronome";
  } else {
    view.querySelector("#l-status").textContent="press Start (step mode waits for the right key)";
  }
}

/* ---------- WORKOUT ---------- */

  const ni=nextUnitIndex();
  const nextSong= ni>=0&&songOf(UNITS[ni].song)&&!UNITS[ni].song.startsWith("chord")&&
                  !UNITS[ni].song.startsWith("switch")&&UNITS[ni].type==="song"
                  ? songOf(UNITS[ni].song) : SONGS.filter(s=>!s.exercise&&s.difficulty===1)[0];

  view.innerHTML=`<h1>⏱ Daily Workout — 5 minutes</h1>
    <p class="sub">Three segments, chained: warm-up → song → chords. Segments use the same lesson engine.</p>
    <div class="grid">
      <div class="card" id="w1"><h3>1 · Reading warm-up</h3><div class="meta">${nextSong.title} in step mode</div></div>
      <div class="card" id="w2"><h3>2 · Play a song</h3><div class="meta">${nextSong.title} — step again, focus on first-try accuracy</div></div>
      <div class="card" id="w3"><h3>3 · Chord drill</h3><div class="meta">${chordUnit?chordUnit.title:"The C Chord"}</div></div>
    </div>
    <p class="sub" style="margin-top:14px">Workout chains launch each segment in sequence — for the prototype, tap each in order.</p>`;
  document.getElementById("w1").onclick=()=>lessonView(null,{song:nextSong,mode:"step"});
  document.getElementById("w2").onclick=()=>lessonView(null,{song:nextSong,mode:"step"});
  document.getElementById("w3").onclick=()=>lessonView(chordUnit?chordUnit.id:null,{song:songOf(chordUnit?chordUnit.song:"chord-c"),mode:"step",fromSongs:true});
}
